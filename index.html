<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Kopi Siap Antar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-stone-100 pb-24">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative overflow-hidden">
        
        <div class="bg-[#292524] p-4 text-center text-[#f59e0b] font-bold text-xl sticky top-0 z-20">☕ WARUNG KOPI</div>

        <div id="halaman-beranda" class="p-4">
            <h2 class="font-bold text-lg mb-4">Daftar Menu</h2>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="halaman-lacak" class="hidden p-6 pt-10 text-center">
            <h2 class="font-bold text-lg mb-4">Lacak Pesanan</h2>
            <input type="text" id="input-nama-lacak" class="w-full border p-3 rounded-xl mb-4" placeholder="Nama Pemesan...">
            <button onclick="cariPesanan()" class="bg-green-600 text-white w-full py-3 rounded-xl font-bold">CARI PESANAN</button>
            <div id="status-lacak-area" class="mt-6 p-4 bg-gray-100 rounded-xl hidden"></div>
        </div>

        <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full max-w-md p-6 rounded-t-2xl shadow-2xl h-[80vh] flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold">Keranjang (COD)</h2>
                    <button onclick="tutupCheckout()" class="text-3xl">&times;</button>
                </div>
                <div id="daftar-pesanan-checkout" class="flex-grow overflow-y-auto"></div>
                <div class="border-t pt-4">
                    <div class="flex justify-between font-bold text-lg mb-4"><span>Total:</span><span id="total-harga-checkout">Rp 0</span></div>
                    <input type="text" id="nama-pemesan" class="w-full border-2 rounded-xl p-3 mb-4 font-bold" placeholder="Nama pemesan...">
                    <button onclick="kirimPesananCOD()" class="w-full bg-[#d97706] text-white py-4 rounded-xl font-bold">KIRIM PESANAN (COD)</button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] text-white flex justify-around items-center px-4 py-4 rounded-t-3xl z-40 shadow-2xl">
            <button onclick="bukaLacak()" class="flex flex-col items-center text-[10px]">🔍<br>LACAK</button>
            <button onclick="bukaBeranda()" class="flex flex-col items-center text-[10px]">🏠<br>BERANDA</button>
            <button onclick="bukaCheckout()" class="flex flex-col items-center text-[10px]">🛒<br>KERANJANG</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let keranjang = JSON.parse(localStorage.getItem('keranjangWarungBasecamp')) || [];

        // Navigasi
        function bukaBeranda() { document.getElementById('halaman-beranda').classList.remove('hidden'); document.getElementById('halaman-lacak').classList.add('hidden'); }
        function bukaLacak() { document.getElementById('halaman-beranda').classList.add('hidden'); document.getElementById('halaman-lacak').classList.remove('hidden'); }
        function bukaCheckout() { document.getElementById('modal-checkout').classList.remove('hidden'); updateTampilanKeranjang(); }
        function tutupCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }

        // Keranjang (+/-)
        function tambahKeKeranjang(nama, harga) {
            let item = keranjang.find(i => i.nama === nama);
            if (item) item.jumlah++; else keranjang.push({ nama, harga, jumlah: 1 });
            localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang));
            alert("Ditambahkan!");
        }

        function ubahJumlah(nama, change) {
            let idx = keranjang.findIndex(i => i.nama === nama);
            if (idx !== -1) {
                keranjang[idx].jumlah += change;
                if (keranjang[idx].jumlah <= 0) keranjang.splice(idx, 1);
                localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang));
                updateTampilanKeranjang();
            }
        }

        function updateTampilanKeranjang() {
            const listArea = document.getElementById('daftar-pesanan-checkout');
            let total = 0;
            listArea.innerHTML = keranjang.map(item => {
                total += (item.harga * item.jumlah);
                return `
                    <div class="flex justify-between items-center py-3 border-b">
                        <span class="font-bold w-1/2 text-sm">${item.nama}</span>
                        <div class="flex items-center gap-3">
                            <button onclick="ubahJumlah('${item.nama}', -1)" class="bg-gray-200 w-8 h-8 rounded-full">-</button>
                            <span class="font-bold">${item.jumlah}</span>
                            <button onclick="ubahJumlah('${item.nama}', 1)" class="bg-orange-500 text-white w-8 h-8 rounded-full">+</button>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('total-harga-checkout').innerText = `Rp ${total.toLocaleString()}`;
        }

        async function loadMenu() {
            const { data } = await clientDB.from('menu_warung').select('*');
            if (data) {
                document.getElementById('ruang-menu').innerHTML = data.map(item => `
                    <div class="bg-white p-3 rounded-xl border">
                        <h3 class="font-bold text-sm">${item.nama_menu}</h3>
                        <p class="text-orange-600 font-bold text-sm">Rp ${item.harga.toLocaleString()}</p>
                        <button onclick="tambahKeKeranjang('${item.nama_menu.replace(/'/g, "\\'")}', ${item.harga})" class="w-full bg-orange-500 text-white py-2 rounded-lg mt-2 text-xs">BELI</button>
                    </div>`).join('');
            }
        }

        async function kirimPesananCOD() {
            const nama = document.getElementById('nama-pemesan').value;
            if(!nama || keranjang.length === 0) return alert("Isi nama dan pesanan!");
            // Tambahkan logika kirim ke Supabase/Telegram Anda di sini
            alert("Pesanan COD dikirim!");
        }

        loadMenu();
    </script>
</body>
</html>
