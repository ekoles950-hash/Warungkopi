<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up - Warung Basecamp Coffee</title>
    <style>
        /* Nuansa Coffee Shop & Ukuran Teks Besar */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4eadd; /* Latar belakang warna krem/latte */
            color: #3b2818; /* Teks cokelat gelap */
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(59, 40, 24, 0.2);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #6f4e37; /* Aksen garis cokelat kopi */
        }
        h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            color: #4a3320;
        }
        .form-group {
            margin-bottom: 25px;
        }
        /* Posisi instruksi persis di atas form input */
        label {
            display: block;
            font-size: 20px; 
            font-weight: bold;
            margin-bottom: 10px;
        }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 20px; 
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #6f4e37;
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            background-color: #6f4e37; /* Tombol warna kopi */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #5a3e2b;
        }
        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Warung Basecamp Coffee</h2>
    
    <div class="form-group">
        <label for="nohp">Masukkan Nomor HP Tujuan:</label>
        <input type="number" id="nohp" placeholder="Contoh: 08123456789" required>
    </div>

    <div class="form-group">
        <label for="produk">Pilih Nominal Top Up:</label>
        <select id="produk">
            <option value="TSEL20">Telkomsel 20.000</option>
            <option value="ISAT20">Indosat 20.000</option>
            <option value="XL20">XL 20.000</option>
        </select>
    </div>

    <button onclick="kirimPesanan()">Pesan Sekarang (COD)</button>
    
    <div class="footer-note">
        *Pulsa langsung masuk, pembayaran via COD (Tunggu di tempat).
    </div>
</div>

<script>
    function kirimPesanan() {
        const nohp = document.getElementById("nohp").value;
        const produk = document.getElementById("produk").value;
        
        if(!nohp) {
            alert("Nomor HP wajib diisi!");
            return;
        }

        // ==========================================
        // MASUKKAN TOKEN BOT & CHAT ID ANDA DI SINI
        // ==========================================
        const botToken = "8669740968:AAE7WcWDDqKcj7V836fFYUaZmdcpwyuecVE";
        const chatId = "7933777456"; 
        
        // Membentuk format pesan yang dikenali oleh script MikroTik Anda
        const pesan = `!topup#${nohp}#${produk}`;
        
        // Memanggil API Telegram langsung dari web
        const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(pesan)}`;
        
        fetch(url)
        .then(response => response.json())
        .then(data => {
            if(data.ok) {
                alert("✅ Pesanan berhasil masuk ke sistem kami! Pulsa sedang diproses, silakan siapkan uang pas.");
                document.getElementById("nohp").value = ""; // Kosongkan kolom input setelah sukses
            } else {
                alert("❌ Gagal mengirim pesanan. Sistem sedang sibuk.");
            }
        })
        .catch(error => {
            alert("Terjadi kesalahan jaringan.");
        });
    }
</script>

</body>
</html>
