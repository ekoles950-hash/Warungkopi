<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Basecamp Coffee - Top Up Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: white; transition: 0.3s; }
        .input-dark:focus { border-color: #3B82F6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .wallet-card { background: #1E293B; border: 2px solid #334155; cursor: pointer; transition: 0.3s; }
        .wallet-card.active { border-color: #3B82F6; background: #1E3A8A; transform: scale(1.02); }
        #toast-topup { visibility: hidden; min-width: 250px; background-color: #1E293B; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 12px; font-weight: 800; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        #toast-topup.show { visibility: visible; animation: slideUp 0.4s; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="toast-topup"></div>

    <div class="w-full max-w-md bg-[#1E293B] p-8 rounded-[2.5rem] shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold italic text-blue-500 tracking-tighter">BASECAMP<span class="text-white"> COFFEE</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">Sengkuni Net & PT FAMILI</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest ml-1">Pilih e-Wallet</label>
                <div class="grid grid-cols-2 gap-4">
                    
                    <div onclick="pilihEWallet('DANA1', 'Dana 1.000', 2000, 'DANA')" id="card-DANA1" class="wallet-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                        <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center font-black text-white text-xs shadow-md">DANA</div>
                        <span class="font-bold text-sm">DANA</span>
                    </div>

                    <div onclick="pilihEWallet('GPY1', 'Gopay 1.000', 2050, 'Gopay')" id="card-GPY1" class="wallet-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                        <div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center font-black text-white text-xs shadow-md">GPY</div>
                        <span class="font-bold text-sm">Gopay</span>
                    </div>

                    <div onclick="pilihEWallet('OVO1', 'OVO 1.000', 2000, 'OVO')" id="card-OVO1" class="wallet-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                        <div class="w-12 h-12 bg-purple-600 rounded-full flex items-center justify-center font-black text-white text-xs shadow-md">OVO</div>
                        <span class="font-bold text-sm">OVO</span>
                    </div>

                    <div onclick="pilihEWallet('SPP1', 'ShopeePay 1.000', 2000, 'ShopeePay')" id="card-SPP1" class="wallet-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                        <div class="w-12 h-12 bg-orange-500 rounded-full flex items-center justify-center font-black text-white text-xs shadow-md">SPP</div>
                        <span class="font-bold text-sm">ShopeePay</span>
                    </div>

                </div>
            </div>

            <div id="form-input-dinamis" class="hidden space-y-4 border-t border-slate-800 pt-4 animate-fade-in">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest ml-1">Nomor HP Tujuan</label>
                    <input type="number" id="nomor_hp" placeholder="08xxxxxxxxxx" required
                        class="w-full p-5 rounded-2xl input-dark text-xl font-bold tracking-wider">
                </div>

                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Harga Produk :</span>
                    <span id="text-harga-pas" class="text-xl font-black text-blue-400">Rp 0</span>
                </div>

                <button onclick="kirimKeSupabase()" id="btn-submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-6 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl transition-all active:scale-95">
                    KIRIM TOP UP
                </button>
            </div>

        </div>
    </div>

    <script>
        // Konek Supabase Project Grabndeso Mas Eko
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Akses Bot Telegram Monitoring
        const TELE_TOKEN = '8669740968:AAE7WcWDDqKcj7V836fFYUaZmdcpwyuecVE';
        const TELE_CHAT_ID = '7933777456'; 

        let skuTerpilih = '';
        let namaProdukTerpilih = '';
        let hargaTerpilih = 0;

        function showToast(msg) {
            const t = document.getElementById("toast-topup");
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 3000);
        }

        // Fungsi Trigger Klik Kartu e-Wallet
        function pilihEWallet(sku, nama, harga, provider) {
            skuTerpilih = sku;
            namaProdukTerpilih = nama;
            hargaTerpilih = harga;
            
            // Atur class active kartu
            document.querySelectorAll('.wallet-card').forEach(card => card.classList.remove('active'));
            document.getElementById('card-' + sku).classList.add('active');

            // Set text harga pas dan buka form input di bawahnya secara otomatis
            document.getElementById('text-harga-pas').innerText = 'Rp ' + harga.toLocaleString('id-ID');
            document.getElementById('form-input-dinamis').classList.remove('hidden');
            
            // Geser fokus langsung ke input nomor HP biar cepat
            document.getElementById('nomor_hp').focus();
        }

        async function kirimKeSupabase() {
            const noHp = document.getElementById('nomor_hp').value.trim();

            if (!noHp) return showToast("⚠️ Isi nomor HP tujuan dulu Mas!");
            if (!skuTerpilih) return showToast("⚠️ Pilih e-Wallet dulu Mas!");

            const btn = document.getElementById('btn-submit');
            btn.innerText = "MEMPROSES...";
            btn.disabled = true;

            // Masuk langsung ke tabel pesanan_pulsa milik Mas Eko (Grabndeso)
            const { data, error } = await sb.from('pesanan_pulsa').insert([{
                nama_produk: namaProdukTerpilih,
                sku_code: skuTerpilih,
                nomor_tujuan: noHp,
                harga_jual: hargaTerpilih,
                status: 'pending'
            }]).select();

            if (error) {
                showToast("❌ Gagal simpan database: " + error.message);
                btn.innerText = "KIRIM TOP UP";
                btn.disabled = false;
            } else {
                showToast("✅ Berhasil Masuk Database!");
                
                // Format Teks Pesan Telegram Otomatis Bunyi
                const pesanTele = `📱 *TOP UP BARU (E-WALLET)* 📱\n\n🎯 *No Tujuan:* ${noHp}\n📦 *Produk:* ${namaProdukTerpilih} (${skuTerpilih})\n💵 *Harga:* Rp ${hargaTerpilih.toLocaleString('id-ID')}\n⚡ *Status:* PENDING\n\n_Warung Basecamp Coffee_`;
                
                kirimNotifTelegram(pesanTele);

                // Reset Tampilan Balik Awal
                document.getElementById('nomor_hp').value = '';
                document.querySelectorAll('.wallet-card').forEach(card => card.classList.remove('active'));
                document.getElementById('form-input-dinamis').classList.add('hidden');
                skuTerpilih = '';
                btn.innerText = "KIRIM TOP UP";
                btn.disabled = false;
            }
        }

        function kirimNotifTelegram(pesan) {
            const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${TELE_CHAT_ID}&text=${encodeURIComponent(pesan)}&parse_mode=Markdown`;
            fetch(url, { mode: 'no-cors' });
        }
    </script>
</body>
</html>
