<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung Basecamp Coffee</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #efebe9; /* Latar warna cream kopi */
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            max-width: 450px; 
            margin: 40px auto; 
            box-shadow: 0 8px 16px rgba(78, 52, 46, 0.2); 
            border-top: 5px solid #4e342e;
        }
        h2 { 
            text-align: center; 
            color: #4e342e; /* Cokelat tua */
            font-size: 28px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #3e2723;
            font-size: 18px; /* Ukuran teks diperbesar */
            margin-bottom: 8px; /* Instruksi persis di atas input */
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            border: 2px solid #d7ccc8; 
            box-sizing: border-box; 
            font-size: 18px; /* Ukuran teks input diperbesar */
        }
        input:focus {
            outline: none;
            border-color: #8d6e63;
        }
        button { 
            width: 100%;
            background-color: #4e342e; 
            color: white; 
            border: none; 
            padding: 15px;
            border-radius: 8px;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 20px;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { 
            background-color: #3e2723; 
        }
        #status {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>☕ Kasir Basecamp</h2>
        
        <form id="kasirForm">
            <!-- Instruksi diletakkan di atas kolom input -->
            <label for="produk">Ketik Kode Produk (Contoh: PULSA50):</label>
            <input type="text" id="produk" placeholder="Masukkan kode..." required>

            <label for="tujuan">Ketik Nomor Tujuan Pelanggan:</label>
            <input type="number" id="tujuan" placeholder="085600..." required>

            <button type="submit">GAS PROSES 🚀</button>
        </form>
        
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('kasirForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            const tombol = document.querySelector('button');
            
            statusEl.innerText = "⏳ Sedang mengirim ke Termux...";
            statusEl.style.color = "#8d6e63";
            tombol.disabled = true;

            const data = {
                produk: document.getElementById('produk').value.trim(),
                tujuan: document.getElementById('tujuan').value.trim()
            };

            try {
                // Menembak ke file backend Vercel (api/kasir.js)
                const res = await fetch('/api/kasir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(result.success) {
                    statusEl.innerText = "✅ Pesanan sukses dikirim ke Termux!";
                    statusEl.style.color = "green";
                    document.getElementById('kasirForm').reset();
                } else {
                    statusEl.innerText = "❌ Gagal: " + result.message;
                    statusEl.style.color = "red";
                }
            } catch (err) {
                statusEl.innerText = "❌ Error koneksi ke server Vercel.";
                statusEl.style.color = "red";
            } finally {
                tombol.disabled = false;
            }
        });
    </script>
</body>
</html>
