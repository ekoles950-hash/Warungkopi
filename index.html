<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Basecamp Coffee - Kasir</title>
    <style>
        body { background: #efebe9; color: #3e2723; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #d7ccc8; border: 3px solid #8d6e63; border-radius: 12px; padding: 25px; max-width: 420px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .instruksi { font-size: 20px; font-weight: bold; color: #4e342e; text-align: left; margin-bottom: 8px; margin-top: 15px;}
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; background: #fff; color: #3e2723; border: 2px solid #a1887f; border-radius: 8px; font-weight: bold; font-size: 20px; box-sizing: border-box; }
        button { width: 100%; background: #5d4037; color: #fff; border: none; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 22px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 10px; }
        button:active { transform: scale(0.95); }
        #pesan_status { display: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #3e2723; margin-top:0;">☕ Warung Basecamp Coffee</h2>
        
        <div id="pesan_status"></div>

        <form id="formTransaksi">
            
            <div class="instruksi">Pilih Nominal Top-Up:</div>
            <select id="kode_produk" required>
                <option value="DN5">DANA 5.000 (DN5)</option>
                <option value="DN10">DANA 10.000 (DN10)</option>
                <option value="DN15">DANA 15.000 (DN15)</option>
                <option value="DN20">DANA 20.000 (DN20)</option>
                <option value="DN25">DANA 25.000 (DN25)</option>
                <option value="DN50">DANA 50.000 (DN50)</option>
            </select>
            
            <div class="instruksi">Masukkan Nomor Tujuan:</div>
            <input type="number" id="nomor_tujuan" placeholder="08..." required>
            
            <div class="instruksi">Masukkan PIN:</div>
            <input type="password" id="pin_trx" placeholder="PIN Transaksi" value="123" required>
            
            <button type="submit">☕ GAS PROSES TRANSAKSI</button>
        </form>
    </div>

    <script>
        document.getElementById("formTransaksi").addEventListener("submit", function(event) {
            event.preventDefault();

            let kode = document.getElementById("kode_produk").value;
            let nomor = document.getElementById("nomor_tujuan").value;
            let pin = document.getElementById("pin_trx").value;
            let statusDiv = document.getElementById("pesan_status");

            let formatPesan = kode + "." + nomor + "." + pin;

            // Token dan Chat ID asli jenengan
            let tokenBot = "8669740968:AAHp--E";
            let chatId = ";
            
            let urlTelegram = "https://api.telegram.org/bot" + tokenBot + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(formatPesan);

            let tombolSubmit = document.querySelector("button[type='submit']");
            let teksTombolAsli = tombolSubmit.innerHTML;
            tombolSubmit.innerHTML = "⏳ MENGIRIM...";
            tombolSubmit.disabled = true;

            fetch(urlTelegram)
                .then(response => response.json())
                .then(data => {
                    statusDiv.style.display = "block";
                    if (data.ok) {
                        statusDiv.style.background = "#d7ccc8";
                        statusDiv.style.color = "#3e2723";
                        statusDiv.style.border = "2px solid #8d6e63";
                        statusDiv.innerHTML = "✅ Transaksi Sukses Masuk Mesin!";
                        document.getElementById("nomor_tujuan").value = "";
                    } else {
                        statusDiv.style.background = "#d32f2f";
                        statusDiv.style.color = "white";
                        statusDiv.style.border = "none";
                        statusDiv.innerHTML = "❌ Gagal: " + data.description;
                    }
                })
                .catch(error => {
                    statusDiv.style.display = "block";
                    statusDiv.style.background = "#d32f2f";
                    statusDiv.style.color = "white";
                    statusDiv.style.border = "none";
                    statusDiv.innerHTML = "❌ Error jaringan!";
                })
                .finally(() => {
                    tombolSubmit.innerHTML = teksTombolAsli;
                    tombolSubmit.disabled = false;
                });
        });
    </script>
</body>
</html>
