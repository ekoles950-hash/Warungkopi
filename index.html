<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO KASIR TELEGRAM</title>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #111; border: 2px solid cyan; border-radius: 10px; padding: 20px; max-width: 350px; margin: auto; box-shadow: 0 0 15px cyan; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; background: #222; color: #fff; border: 1px solid #0f0; border-radius: 5px; font-weight: bold; }
        button { width: 95%; background: linear-gradient(45deg, cyan, blue); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 10px cyan; margin-top: 10px; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: cyan; margin-top:0;">🚀 AUTO TEMBAK BOT</h2>
        <p style="font-size:12px; color:#aaa;">Pilih nominal, masukkan nomor, dan gas!</p>
        
        <!-- Input Form -->
        <select id="kode_produk">
            <option value="DN5">DANA 5.000 (DN5)</option>
            <option value="DN10">DANA 10.000 (DN10)</option>
            <option value="DN50">DANA 50.000 (DN50)</option>
            <option value="GP5000">GOPAY 5.000 (GP5000)</option>
        </select>
        
        <input type="number" id="nomor_tujuan" placeholder="Nomor Pembeli (0856...)">
        <input type="password" id="pin_trx" placeholder="PIN Transaksi" value="123">
        
        <!-- Tombol Aksi -->
        <button onclick="gasTembak()">🚀 COPY & BUKA TELEGRAM</button>
    </div>

    <script>
        function gasTembak() {
            // 1. Ambil data dari inputan
            let kode = document.getElementById("kode_produk").value;
            let nomor = document.getElementById("nomor_tujuan").value;
            let pin = document.getElementById("pin_trx").value;

            // Validasi jika kosong
            if(nomor === "" || pin === "") {
                alert("Isi nomor dan PIN dulu Mas Eko!");
                return;
            }

            // 2. Rakit format pesannya
            let formatPesan = kode + "." + nomor + "." + pin;

            // 3. Copy ke Clipboard HP
            navigator.clipboard.writeText(formatPesan).then(function() {
                // 4. Buka Telegram dan arahkan ke Bot (GANTI 'username_bot_nya' DENGAN USERNAME ASLI BOT VILLAGE PAYMENT)
                let usernameBot = "VillagePaymentBot"; // <-- Ganti bagian ini sesuai username asli botnya tanpa tanda @
                
                // Pindah langsung ke aplikasi Telegram
                window.location.href = "tg://resolve?domain=" + usernameBot;
                
            }).catch(function(err) {
                alert("Gagal Copy! Coba cek izin browsernya.");
            });
        }
    </script>
</body>
</html>
