<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab Ndeso - Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] text-white">
    <div class="max-w-md mx-auto p-5">
        <h1 class="text-center font-black italic mb-5">GRAB<span class="text-green-500">NDESO</span></h1>
        
        <input type="number" id="no-tujuan" class="w-full bg-slate-800 p-4 rounded-xl mb-4 outline-none border border-white/5" placeholder="Nomor HP Tujuan">

        <div class="grid grid-cols-2 gap-4">
            <div onclick="bayar('D1', 1200)" class="bg-slate-800 p-4 rounded-xl cursor-pointer hover:bg-blue-600">
                <p class="font-bold">DANA 1.000</p>
                <p class="text-green-400">Rp 1.200</p>
            </div>
            <div onclick="bayar('GPY1', 2000)" class="bg-slate-800 p-4 rounded-xl cursor-pointer hover:bg-blue-600">
                <p class="font-bold">GOPAY 1.000</p>
                <p class="text-green-400">Rp 2.000</p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'umLxK4aar0mC0gNkNq8BVJ2FyQ7L9LQss9pZhVW'; // API KEY TERBARU
        const M_CODE  = 'T50086';

        function bayar(sku, harga) {
            const no = document.getElementById('no-tujuan').value;
            if(!no) return alert("Isi nomor dulu!");
            // Arahkan ke file index.php di InfinityFree
            window.location.href = `https://grabndeso.wuaze.com/index.php?harga=${harga}&wa=${no}&sku=${sku}&mcode=${M_CODE}&apikey=${API_KEY}`;
        }
    </script>
</body>
</html>
