<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Basecamp Coffee - Tagihan & Laporan</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Tema Visual Warung Basecamp Coffee */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4ece1; padding: 15px; margin: 0; color: #3e2723; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(93, 64, 55, 0.1); border-top: 5px solid #8B5A2B; }
    
    h2 { text-align: center; color: #5d4037; margin-bottom: 20px; border-bottom: 3px solid #8B5A2B; padding-bottom: 10px; }
    
    /* Layout Instruksi di atas dengan teks diperbesar */
    .instruction-box { background: #efebe9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #795548; font-size: 15px; font-weight: bold; color: #4e342e; line-height: 1.4; }
    
    .summary-box { background: #d7ccc8; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #bcaaa4; text-align: center; }
    .summary-box span { display: block; font-size: 14px; color: #5d4037; font-weight: bold; }
    .summary-box #totalDisplay { font-size: 24px; color: #3e2723; }

    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #5d4037; font-size: 14px; }
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d7ccc8; font-size: 16px; outline: none; box-sizing: border-box; background: #fff; color: #3e2723; }
    
    .item { border-bottom: 1px solid #efebe9; padding: 15px 0; }
    .nama { font-weight: bold; font-size: 18px; color: #3e2723; text-transform: capitalize; display: block; }
    .detail { font-size: 14px; color: #6d4c41; margin-top: 3px; margin-bottom: 10px; display: block; }
    
    /* Grid Tombol Aksi */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; transition: 0.2s; text-align: center; outline: none; }
    
    .btn-wa { background-color: #25D366; }
    .btn-telegram { background-color: #0088cc; }
    .btn-supabase { background-color: #6d4c41; } /* Warna cokelat Basecamp */
    .btn-lunas { background-color: #007bff; }
    
    .btn:active { transform: scale(0.95); opacity: 0.9; }
    .btn:disabled { background-color: #bcaaa4; cursor: not-allowed; }
    #loading { text-align: center; color: #8d6e63; font-style: italic; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Warung Basecamp Coffee</h2>
    
    <div class="instruction-box">
      Pilih bulan tagihan dan tanggal jatuh tempo terlebih dahulu sebelum mengirim laporan atau menyinkronkan data klien.
    </div>

    <div class="summary-box">
      <span>TOTAL GABUNGAN HARI INI (TELEGRAM):</span>
      <strong id="totalDisplay">Rp 0</strong>
    </div>

    <div class="form-group">
      <label>Pilih Bulan Tagihan:</label>
      <select id="bulanSelect">
        <option value="Januari">Januari</option>
        <option value="Februari">Februari</option>
        <option value="Maret">Maret</option>
        <option value="April">April</option>
        <option value="Mei">Mei</option>
        <option value="Juni" selected>Juni</option>
        <option value="Juli">Juli</option>
        <option value="Agustus">Agustus</option>
        <option value="September">September</option>
        <option value="Oktober">Oktober</option>
        <option value="November">November</option>
        <option value="Desember">Desember</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tanggal Jatuh Tempo:</label>
      <input type="number" id="tglTempo" value="4">
    </div>

    <div id="loading">Menyeduh data pelanggan... ☕</div>
    <div id="listPelanggan"></div>
  </div>

  <script>
    // --- KONFIGURASI API & DATABASE ---
    const TOKEN_FONNTE = "CEjeWxk7WvpFJaNL94Km";
    const TELEGRAM_TOKEN = "8669839359:AAGPkRpOiLlYoBc3t4IgxcAGSgKFC8v1SwU";
    const TELEGRAM_CHAT_ID = "7933777456";
    
    // Kredensial Supabase Anda (Koneksi ke Web 1 Admin)
    const supabaseUrl = 'https://wfcmhdqtoftuyfjtyfkk.supabase.co';
    const supabaseKey = 'sb_publishable_TE45MyojofIEUkZyvLkHmg_xnsk92Ld';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    
    // Url Apps Script dari data input Anda
    const SCRIPT_FIRMAN = "https://script.google.com/macros/s/AKfycbwpSA_UfqSUzK6JFZkvJkrftgOqRjKL-HzA8OLtfAQEaOM3iC3H90YjXv6pI3D-kGQ/exec";
    const SCRIPT_RENDI = "https://script.google.com/macros/s/LINK_SCRIPT_RENDI_DI_SINI"; 

    // Url Spreadsheet CSV Anda
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV673nBl_6Wn_6eBjiJzoSQfHDn0VQRCNTGsjrdo2fLPFZenxVD1MBvatyIJ8mTGuZX58w5UI3uII9/pub?output=csv";

    let totalGabungan = 0;

    // --- LOAD DATA MENGGUNAKAN PAPAPARSE URUTAN ASLI ---
    Papa.parse(csvUrl, {
      download: true,
      complete: function(results) {
        document.getElementById('loading').style.display = 'none';
        tampilkanData(results.data.slice(1));
      }
    });

    function tampilkanData(data) {
      const container = document.getElementById('listPelanggan');
      data.forEach(row => {
        if (!row[0]) return;
        const nama = row[0].trim();
        const noWa = row[1] ? row[1].toString().trim() : "";
        const idPel = row[2] ? row[2].trim() : "-";
        const harga = row[3] ? row[3].toString().replace(/[^0-9]/g, '') : "0";
        const petugas = row[4] ? row[4].toLowerCase().trim() : "";
        
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="info">
            <span class="nama">${nama}</span>
            <span class="detail">ID: ${idPel} | <b>Rp ${parseInt(harga).toLocaleString('id-ID')}</b></span>
          </div>
          <div class="actions">
            <button class="btn btn-wa" onclick="kirimFonnte('${nama}', '${noWa}', '${idPel}', '${harga}', this)">Kirim WA</button>
            <button class="btn btn-telegram" onclick="laporTelegram('${nama}', '${harga}', this)">Lapor Telegram</button>
            <button class="btn btn-supabase" onclick="laporSupabase('${nama}', '${harga}', this)">Kirim ke Web 1</button>
            <button class="btn btn-lunas" onclick="setLunas('${nama}', '${idPel}', '${harga}', '${petugas}', this)">Set Lunas</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- TEMPLATE PESAN WA ---
    function buatPesan(nama, idPel, harga) {
      const bulan = document.getElementById('bulanSelect').value;
      const tgl = document.getElementById('tglTempo').value;
      return `sistem chat otomatis tidak perlu di balas❌\nPelanggan SENGKUNI NET\nYth. *${nama}*\nKami sampaikan tagihan layanan internet bulan *${bulan}.${new Date().getFullYear()}*\nDengan ID Pelanggan *${idPel}*\nSebesar *Rp ${parseInt(harga).toLocaleString('id-ID')}*\nPembayaran paling lambat di tanggal *${tgl}*\nPembayaran nunggu tukang narik\nAdmin bendahara : RENDI dan FIRMAN\nuntuk menghindari isolir kecepatan menurun otomatis di jaringan anda`;
    }

    // --- AKSI 1: KIRIM WA (FONNTE) ---
    async function kirimFonnte(nama, noWa, idPel, harga, btn) {
      let hp = noWa.replace(/[^0-9]/g, '');
      if (hp.startsWith('0')) hp = '62' + hp.substring(1);
      
      btn.innerText = "Mengirim...";
      try {
        await fetch('https://api.fonnte.com/send', {
          method: 'POST',
          headers: { 'Authorization': TOKEN_FONNTE },
          body: new URLSearchParams({ 'target': hp, 'message': buatPesan(nama, idPel, harga) })
        });
        btn.innerText = "WA Sent ✅";
        btn.style.backgroundColor = "#7f8c8d";
      } catch (e) { btn.innerText = "Gagal"; }
    }

    // --- AKSI 2: LAPOR TELEGRAM ---
    function laporTelegram(nama, harga, btn) {
      const nominal = parseInt(harga);
      totalGabungan += nominal;
      document.getElementById('totalDisplay').innerText = "Rp " + totalGabungan.toLocaleString('id-ID');

      const text = `💰 *LAPORAN MASUK*\n👤 Nama: *${nama}*\n💵 Nominal: *Rp ${nominal.toLocaleString('id-ID')}*\n📈 TOTAL: *Rp ${totalGabungan.toLocaleString('id-ID')}*\n⏰ ${new Date().toLocaleString('id-ID')}`;

      fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`)
      .then(() => {
        btn.innerText = "Telegram ✅";
        btn.style.backgroundColor = "#7f8c8d";
        btn.disabled = true;
      });
    }

    // --- AKSI 3: KIRIM KE SUPABASE (WEB 1 MONITOR) ---
    async function laporSupabase(nama, harga, btn) {
      btn.innerText = "Proses...";
      btn.disabled = true;

      const { data, error } = await supabase
        .from('laporan_tagihan')
        .insert([{ 
          nama_klien: nama, 
          jumlah_tagihan: harga, 
          status: 'belum bayar' 
        }]);
      
      if (error) {
        alert("Gagal sinkronisasi Supabase: " + error.message);
        btn.innerText = "Kirim ke Web 1";
        btn.disabled = false;
      } else {
        btn.innerText = "Web 1 Sent ✅";
        btn.style.backgroundColor = "#4caf50";
      }
    }

    // --- AKSI 4: SET LUNAS (GOOGLE APPS SCRIPT) ---
    async function setLunas(nama, id, harga, petugas, btn) {
      if(!confirm("Set Lunas untuk " + nama + "?")) return;
      
      let scriptUrl = (petugas === "rendi") ? SCRIPT_RENDI : SCRIPT_FIRMAN;
      btn.innerText = "...";

      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ 'nama': nama, 'id': id, 'nominal': harga })
        });
        btn.innerText = "Lunas ✅";
        btn.style.backgroundColor = "#6c757d";
        btn.disabled = true;
      } catch (e) { alert("Error Apps Script"); }
    }
  </script>
</body>
</html>
