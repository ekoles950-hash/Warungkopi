<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Grab Ndeso - E-Wallet Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; margin: 0; padding-bottom: 100px; }
        .card-nominal { background: #1E293B; border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; text-align: left; }
        .card-nominal:active { transform: scale(0.95); background: #1E40AF; border-color: #3B82F6; }
        header { background: #0F172A; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; z-index: 5000; }
        .modal-content { background: #1E293B; width: 100%; max-width: 450px; border-radius: 35px 35px 0 0; padding: 35px; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1 class="text-xl font-black italic tracking-[0.2em]">GRAB<span class="text-green-500">NDESO</span></h1>
    </header>

    <div class="max-w-md mx-auto p-5">
        <div id="konten-menu" class="grid grid-cols-2 gap-4">
            <div class="col-span-2 bg-slate-800 p-6 rounded-[2.5rem] border border-blue-500/20 mb-2">
                <p class="text-[9px] font-black text-slate-500 uppercase mb-3 tracking-widest">Nomor HP E-Wallet</p>
                <input type="number" id="no-tujuan" class="w-full bg-[#0F172A] p-5 rounded-2xl text-white font-black text-lg outline-none border border-white/5 focus:border-blue-600 transition" placeholder="08xxxxxxxx">
            </div>
            <!-- Produk sesuai kode OkeConnect Mas Eko -->
            <div onclick="pilihEwallet('DANA 1.000', 1200, 'D1', 'DANA')" class="card-nominal">
                <p class="text-[10px] bg-blue-900/30 text-blue-400 w-fit px-2 py-0.5 rounded mb-2 font-bold">DANA</p>
                <p class="text-sm font-black text-white uppercase mb-1">DANA 1.000</p>
                <p class="text-green-500 font-black text-sm italic">Rp 1.200</p>
            </div>
            <div onclick="pilihEwallet('GOPAY 1.000', 2000, 'GPY1', 'GOPAY')" class="card-nominal">
                <p class="text-[10px] bg-green-900/30 text-green-400 w-fit px-2 py-0.5 rounded mb-2 font-bold">GOPAY</p>
                <p class="text-sm font-black text-white uppercase mb-1">GOPAY 1.000</p>
                <p class="text-green-500 font-black text-sm italic">Rp 2.000</p>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-black mb-6 italic uppercase">Konfirmasi Top Up</h3>
            <div id="detail-checkout" class="bg-[#0F172A] p-6 rounded-3xl border border-white/5 mb-8"></div>
            <button onclick="prosesKeKasir()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase italic shadow-xl active:scale-95 transition">Bayar Sekarang</button>
            <button onclick="tutupModal()" class="w-full mt-3 py-2 text-slate-500 font-bold text-sm">Batal</button>
        </div>
    </div>

    <script>
        let dataTransaksi = {};

        function pilihEwallet(nama, harga, sku, provider) {
            const no = document.getElementById('no-tujuan').value;
            if(!no || no.length < 10) return alert("Isi Nomor HP!");
            dataTransaksi = { nama, harga, target: no, sku, prov: provider };
            document.getElementById('detail-checkout').innerHTML = `
                <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">${dataTransaksi.prov}</p>
                <p class="font-black text-white text-lg mb-4">${dataTransaksi.target}</p>
                <p class="text-xs font-bold text-slate-400">Total: Rp ${dataTransaksi.harga.toLocaleString('id-ID')}</p>
            `;
            document.getElementById('modal-checkout').style.display = 'flex';
        }

        function prosesKeKasir() {
            // URL diarahkan ke hosting InfinityFree Mas
            window.location.href = `https://grabndeso.wuaze.com/index.php?harga=${dataTransaksi.harga}&wa=${dataTransaksi.target}&sku=${dataTransaksi.sku}`;
        }

        function tutupModal() { document.getElementById('modal-checkout').style.display = 'none'; }
    </script>
</body>
</html>
