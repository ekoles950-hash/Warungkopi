<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Grab Ndeso - GoPulsa Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; margin: 0; padding-bottom: 100px; }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: white; border-radius: 1rem; padding: 15px; outline: none; }
        .input-dark:focus { border-color: #10B981; }
        .card-pulsa { background: #1E293B; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; text-align: center; }
        .card-pulsa:active { transform: scale(0.95); background: #064E3B; border-color: #10B981; }
        header { background: #0F172A; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-bawah { position: fixed; bottom: 0; left: 0; right: 0; background: #1E293B; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #334155; max-width: 450px; margin: auto; border-radius: 20px 20px 0 0; }
        #toast-global { visibility: hidden; background: #10B981; color: white; padding: 12px 25px; position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); border-radius: 50px; font-weight: bold; z-index: 9999; font-size: 12px; }
        #toast-global.show { visibility: visible; animation: fadeInUp 0.4s; }
        @keyframes fadeInUp { from { opacity:0; transform: translate(-50%, 20px); } to { opacity:1; transform: translate(-50%, 0); } }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; justify-content: center; z-index: 5000; }
        .modal-content { background: #1E293B; width: 100%; max-width: 450px; border-radius: 30px 30px 0 0; padding: 30px; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="toast-global"></div>

    <header>
        <h1 class="text-xl font-black italic tracking-widest">GRAB<span class="text-green-500">NDESO</span></h1>
    </header>

    <div class="max-w-md mx-auto p-5">
        <!-- TOMBOL KATEGORI -->
        <div class="flex gap-2 mb-6">
            <button onclick="loadMenu()" class="flex-1 py-3 bg-slate-800 rounded-2xl text-[10px] font-black uppercase tracking-wider">🍱 Makanan</button>
            <button onclick="loadMenuPPOB()" class="flex-1 py-3 bg-green-600 rounded-2xl text-[10px] font-black uppercase tracking-wider">📱 Pulsa & Kuota</button>
        </div>

        <div id="konten-menu" class="grid grid-cols-2 gap-4">
            <!-- Isi Menu Akan Muncul Di Sini -->
        </div>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="modal-checkout" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-black mb-5 italic uppercase">Konfirmasi Bayar</h3>
            <div id="detail-checkout" class="space-y-4 mb-6">
                <!-- Detail Pesanan -->
            </div>
            <button onclick="bayarSekarang()" class="w-full bg-green-600 py-4 rounded-2xl font-black uppercase italic shadow-lg">Bayar Sekarang</button>
            <button onclick="tutupModal()" class="w-full mt-2 py-4 text-slate-400 font-bold">Batal</button>
        </div>
    </div>

    <nav class="nav-bawah">
        <button onclick="location.reload()" class="text-center">🏠<br><span class="text-[9px] font-bold text-green-500">Beranda</span></button>
        <button onclick="showToast('Fitur Lacak Aktif!')" class="text-center opacity-50">🔍<br><span class="text-[9px] font-bold text-slate-500">Lacak</span></button>
        <button onclick="showToast('Hubungi Admin Mas Eko')" class="text-center opacity-50">💬<br><span class="text-[9px] font-bold text-slate-500">Chat</span></button>
    </nav>

    <script>
        // CONFIG
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let keranjang = {};

        function showToast(msg) {
            const t = document.getElementById("toast-global");
            t.innerText = msg; t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3000);
        }

        // --- MENU MAKANAN ---
        async function loadMenu() {
            const container = document.getElementById('konten-menu');
            container.innerHTML = '<p class="col-span-2 text-center text-xs opacity-50">Memuat Menu...</p>';
            const { data } = await sb.from('menu_makanan').select('*').eq('stok_tersedia', true);
            container.innerHTML = '';
            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-800 p-3 rounded-[2rem] border border-white/5">
                        <img src="${item.foto_url}" class="w-full h-32 object-cover rounded-3xl mb-3">
                        <p class="text-[10px] font-bold uppercase px-2">${item.nama_makanan}</p>
                        <p class="text-green-500 font-black text-sm px-2 mb-3">Rp ${item.harga.toLocaleString('id-ID')}</p>
                        <button onclick="beliMakanan('${item.nama_makanan}', ${item.harga})" class="w-full bg-white/5 py-3 rounded-2xl text-[9px] font-black uppercase">Beli</button>
                    </div>`;
            });
        }

        // --- MENU PPOB (ALA GOPULSA) ---
        function loadMenuPPOB() {
            const container = document.getElementById('konten-menu');
            const daftarPulsa = [
                { nominal: '5rb', harga: 7000, kode: 'P5' },
                { nominal: '10rb', harga: 11500, kode: 'P10' },
                { nominal: '20rb', harga: 21500, kode: 'P20' },
                { nominal: '50rb', harga: 51500, kode: 'P50' }
            ];

            container.innerHTML = `
                <div class="col-span-2 bg-slate-800 p-5 rounded-[2rem] border border-green-500/20 mb-2">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-2">Nomor HP Tujuan</p>
                    <input type="number" id="no-hp" class="w-full bg-[#0F172A] p-4 rounded-2xl text-white font-bold outline-none border border-white/10 focus:border-green-500" placeholder="08xxxxxxxxxx">
                </div>
            `;

            daftarPulsa.forEach(item => {
                container.innerHTML += `
                    <div onclick="pilihPulsa('${item.nominal}', ${item.harga}, '${item.kode}')" class="card-pulsa">
                        <p class="text-xl font-black">${item.nominal}</p>
                        <p class="text-green-500 font-bold text-xs mt-1">Rp ${item.harga.toLocaleString('id-ID')}</p>
                    </div>`;
            });
        }

        function pilihPulsa(nom, harga, kode) {
            const no = document.getElementById('no-hp').value;
            if(!no || no.length < 10) return showToast("⚠️ Isi Nomor HP dulu Mas!");
            
            keranjang = { nama: "PULSA " + nom, harga: harga, target: no, kode: kode };
            
            document.getElementById('detail-checkout').innerHTML = `
                <div class="bg-[#0F172A] p-4 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Produk</p>
                    <p class="font-black text-white">${keranjang.nama}</p>
                    <hr class="my-3 border-white/5">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Nomor Tujuan</p>
                    <p class="font-black text-green-500 text-lg">${keranjang.target}</p>
                    <hr class="my-3 border-white/5">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Total Tagihan</p>
                    <p class="font-black text-white text-xl">Rp ${keranjang.harga.toLocaleString('id-ID')}</p>
                </div>
            `;
            document.getElementById('modal-checkout').style.display = 'flex';
        }

        function bayarSekarang() {
            showToast("🚀 Mengarahkan ke Kasir...");
            setTimeout(() => {
                // KIRIM KE INFINITYFREE
                window.location.href = `https://grabndeso.wuaze.com/index.php?harga=${keranjang.harga}&wa=${keranjang.target}`;
            }, 2000);
        }

        function tutupModal() { document.getElementById('modal-checkout').style.display = 'none'; }

        // Start
        loadMenu();
    </script>
</body>
</html>
