<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Warung Kopi Siap Antar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes jalan-maju {
            0% { transform: translateX(-10px) scaleX(-1); }
            50% { transform: translateX(10px) scaleX(-1); }
            100% { transform: translateX(-10px) scaleX(-1); }
        }
        .animasi-jalan-maju { animation: jalan-maju 1.5s infinite ease-in-out; display: inline-block; }

        @keyframes lompat-jalan {
            0%, 100% { transform: translateY(0) scaleX(-1); }
            50% { transform: translateY(-8px) scaleX(-1); }
        }
        .animasi-kurir-jalan { animation: lompat-jalan 0.6s infinite; }
        .kurir-diam { transform: scaleX(-1); }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-stone-100 pb-24">

    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 z-[100] transition-all duration-300 pointer-events-none w-[90%] max-w-sm">
        <div id="toast-content" class="px-6 py-3 rounded-full shadow-2xl text-sm font-bold text-white flex items-center justify-center gap-2"></div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden border border-stone-200 relative">
        
        <div class="bg-[#292524] text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-[#d97706] relative" id="header-utama">
            <h1 class="text-xl font-extrabold text-center tracking-wide text-[#f59e0b] leading-snug">☕WARUNG KOPI SIAP ANTAR</h1>
            <p class="text-center text-sm text-stone-200 mt-1"> <span class="animasi-jalan-maju">🚶‍♀️</span></p>
            <button onclick="bukaModalPin()" class="absolute right-4 top-1/2 -translate-y-1/2 text-xl opacity-60 hover:opacity-100 transition duration-300">⚙️</button>
        </div>

        <div class="p-4 bg-stone-50 min-h-screen" id="halaman-beranda">
            <h2 class="text-lg font-bold text-stone-800 mb-3 sticky top-[92px] bg-stone-50 z-10 pt-2 pb-1">Daftar Menu</h2>
            <div id="kategori-container" class="flex gap-2 overflow-x-auto hide-scroll mb-4 pb-2 border-b-2 border-stone-200 sticky top-[132px] bg-stone-50 z-10"></div>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div class="min-h-screen bg-[#131722] text-white p-5 flex-col items-center pt-8 pb-24 hidden" id="halaman-lacak-visual">
            <h3 class="text-[#22c55e] font-extrabold text-xs tracking-[0.2em] mb-3 text-center">LIVE TRACKING</h3>
            <h1 id="teks-status-lacak" class="text-2xl font-extrabold italic text-white mb-10 text-center tracking-wide">MENCARI PESANAN...</h1>
            <div class="bg-[#1e2536] w-full rounded-[2rem] p-6 relative h-64 shadow-2xl border border-gray-700/50 mb-8">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
                    <path d="M 20,75 C 40,75 50,25 80,25" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
                </svg>
                <div class="absolute bottom-[10%] left-[8%] flex flex-col items-center z-10"><div class="text-4xl">🏪</div></div>
                <div class="absolute top-[8%] right-[8%] flex flex-col items-center z-10"><div class="text-4xl">🏠</div></div>
                <div id="ikon-kurir" class="absolute text-5xl transition-all duration-1000 ease-in-out z-20 kurir-diam" style="left: 10%; top: 55%;">🚶</div>
            </div>
            <div class="bg-[#1e2536] rounded-2xl w-full p-5 text-center italic text-gray-400 text-sm font-medium border border-gray-800">
                <span id="pesan-motivasi">"Mohon tunggu ya, pesananmu sedang diproses!"</span>
            </div>
            <button onclick="bukaBeranda()" class="mt-6 bg-[#161b28] border border-gray-700 w-full py-4 rounded-xl font-extrabold text-sm text-gray-300 hover:text-white hover:bg-gray-800 transition shadow-lg tracking-wide">KEMBALI KE MENU</button>
        </div>

        <div id="modal-lacak" class="hidden fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-5">
            <div class="bg-[#242b3d] w-full max-w-sm rounded-[2rem] p-6 shadow-2xl border border-gray-700 relative animate-[slideUp_0.2s_ease-out]">
                <button onclick="tutupModalLacak()" class="absolute top-5 right-6 text-gray-400 hover:text-white text-2xl font-light">&times;</button>
                <h2 class="text-white font-extrabold italic text-lg mb-6 tracking-wide mt-2">LACAK PESANAN</h2>
                <input type="text" id="input-nama-lacak" class="w-full bg-[#1b2130] border border-gray-600 rounded-2xl p-4 text-white placeholder-gray-500 outline-none focus:border-[#22c55e] mb-6 font-bold text-sm transition" placeholder="Ketik Nama...">
                <button id="btn-cari-lacak" onclick="cariPesanan()" class="w-full bg-[#22c55e] text-white font-extrabold py-4 rounded-xl shadow-[0_4px_20px_rgba(34,197,94,0.3)] active:scale-95 transition tracking-wider text-sm">CARI</button>
            </div>
        </div>

        <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl shadow-2xl animate-[slideUp_0.3s_ease-out] max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2 shrink-0">
                    <h2 class="text-xl font-bold text-stone-800">Keranjang</h2>
                    <button onclick="tutupCheckout()" class="text-stone-400 hover:text-red-500 font-bold text-3xl">&times;</button>
                </div>
                <div class="overflow-y-auto hide-scroll mb-2 shrink">
                    <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                        <div id="daftar-pesanan-checkout" class="flex flex-col"></div>
                        <div class="flex justify-between items-center border-t border-stone-300 pt-3 mt-2">
                            <span class="font-bold text-stone-800">Total:</span>
                            <span id="total-harga-checkout" class="font-extrabold text-[#d97706] text-xl">Rp 0</span>
                        </div>
                    </div>
                </div>
                <div class="space-y-4 shrink-0 mt-3 border-t-2 border-stone-100 pt-4">
                    <input type="text" id="nama-pemesan" class="w-full border-2 border-stone-300 rounded-xl p-3 text-lg focus:border-[#d97706] outline-none font-bold placeholder-stone-400" placeholder="Ketik nama...">
                    <button id="btn-kirim" onclick="kirimPesananKopi()" class="w-full bg-[#d97706] text-white font-extrabold py-3.5 mt-2 rounded-xl shadow-lg active:scale-95 transition text-lg">Kirim Pesanan</button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] border-t border-gray-800 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.5)] z-40 flex justify-around items-center px-4 py-3 pb-safe rounded-t-3xl" id="nav-bawah">
            <button onclick="bukaModalLacak()" class="flex flex-col items-center text-gray-400 hover:text-white transition relative">
                <span class="text-2xl">🔍</span><span class="text-[9px] font-extrabold mt-1 tracking-wide">LACAK</span>
            </button>
            <button onclick="bukaBeranda()" class="flex flex-col items-center text-[#22c55e] hover:text-green-400 transition relative bg-[#1f2937] p-3 rounded-2xl -mt-8 shadow-lg border border-gray-700">
                <span class="text-3xl">🏠</span><span class="text-[9px] font-extrabold mt-1 tracking-wide text-white">BERANDA</span>
            </button>
            <button onclick="bukaTopUp()" class="flex flex-col items-center text-gray-400 hover:text-white transition relative">
                <span class="text-2xl">💳</span><span class="text-[9px] font-extrabold mt-1 tracking-wide text-center">TOP UP<br>OFF</span>
            </button>
            <button onclick="bukaCheckout()" class="flex flex-col items-center text-gray-400 hover:text-white transition relative pr-2">
                <span class="text-2xl">🛒</span><span class="text-[9px] font-extrabold mt-1 tracking-wide">KERANJANG</span>
                <span id="jumlah-item-bawah" class="absolute -top-1 right-0 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold shadow-sm hidden">0</span>
            </button>
        </div>
    </div>

    <script>
        const PIN_RAHASIA = '1234';
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const TELE_TOKEN_KOPI = '8854342299:AAF3dBZvDDItaPS08hhYI_-0Q4ccm-dKgPs';
        const TELE_ID_KOPI = '8498622906';
        
        let keranjang = JSON.parse(localStorage.getItem('keranjangWarungBasecamp')) || [];
        let semuaMenuDB = [];
        let kategoriSaatIni = 'Semua';
        let pesananAktif = null;
        let isWarungBuka = true;

        async function cekStatusWarungDB() {
            try {
                const { data } = await clientDB.from('pengaturan_warung').select('status_buka').eq('id', 1).single();
                if (data) isWarungBuka = data.status_buka;
            } catch (e) {}
        }

        function bukaTopUp() { tampilkanNotifikasi("Fitur Top Up saat ini tidak tersedia."); }
        
        function tampilkanNotifikasi(pesan) {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toast-content');
            toastContent.className = 'px-6 py-3 rounded-full shadow-lg text-sm font-bold text-white flex items-center justify-center gap-2 bg-stone-800 w-full';
            toastContent.innerHTML = `<span>${pesan}</span>`;
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('-translate-y-24', 'opacity-0'); }, 3000);
        }

        function tutupSemuaHalaman() {
            document.getElementById('halaman-beranda').classList.add('hidden');
            document.getElementById('header-utama').classList.add('hidden'); 
            document.getElementById('halaman-lacak-visual').classList.add('hidden');
            document.getElementById('halaman-lacak-visual').classList.remove('flex');
        }

        function bukaBeranda() { 
            tutupSemuaHalaman();
            document.getElementById('halaman-beranda').classList.remove('hidden'); 
            document.getElementById('header-utama').classList.remove('hidden');
        }

        async function ambilDataMenu() {
            const { data } = await clientDB.from('menu_warung').select('*').order('nama_menu', { ascending: true });
            if(data) { semuaMenuDB = data; renderMenu(); }
        }

        function renderMenu() {
            const ruangMenu = document.getElementById('ruang-menu');
            ruangMenu.innerHTML = ''; 
            semuaMenuDB.forEach(item => {
                const gambar = item.foto_url || 'https://placehold.co/400x300?text=Menu';
                ruangMenu.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col">
                        <img src="${gambar}" class="w-full h-32 object-cover">
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-stone-800 text-sm leading-tight">${item.nama_menu}</h3>
                            <p class="text-[#d97706] font-extrabold text-sm mt-2">Rp ${item.harga.toLocaleString('id-ID')}</p>
                            <button onclick="tambahKeKeranjang('${item.nama_menu.replace(/'/g, "\\'")}', ${item.harga})" class="mt-3 w-full bg-[#d97706] text-white font-bold text-xs py-2.5 rounded-lg active:scale-95 shadow-sm">BELI</button>
                        </div>
                    </div>`;
            });
        }

        function tambahKeKeranjang(nama, harga) {
            const itemAda = keranjang.find(item => item.nama === nama);
            if (itemAda) itemAda.jumlah += 1; else keranjang.push({ nama, harga, jumlah: 1 });
            localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang));
            updateTampilanKeranjang();
            tampilkanNotifikasi("Dimasukkan keranjang! 🛒");
        }

        function updateTampilanKeranjang() {
            const badge = document.getElementById('jumlah-item-bawah');
            const listArea = document.getElementById('daftar-pesanan-checkout');
            if (keranjang.length === 0) { badge.classList.add('hidden'); listArea.innerHTML = `<div class="text-center py-6 text-stone-400">Kosong</div>`; return; }
            badge.classList.remove('hidden');
            let qty = 0, total = 0, html = '';
            keranjang.forEach(item => {
                qty += item.jumlah; total += item.harga * item.jumlah;
                html += `<div class="flex justify-between items-center py-2"><span class="text-sm font-bold">${item.nama}</span><span class="text-sm">${item.jumlah}x</span></div>`;
            });
            badge.innerText = qty; listArea.innerHTML = html; document.getElementById('total-harga-checkout').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function bukaCheckout() { document.getElementById('modal-checkout').classList.remove('hidden'); }
        function tutupCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }
        function tutupModalLacak() { document.getElementById('modal-lacak').classList.add('hidden'); }
        function bukaModalPin() { alert("Akses Admin (Hanya untuk pengelola)"); }

        async function kirimPesananKopi() {
            const nama = document.getElementById('nama-pemesan').value;
            if (!nama) return tampilkanNotifikasi("Isi nama dulu!");
            tampilkanNotifikasi("Pesanan berhasil dikirim ke Admin!");
            tutupCheckout();
        }

        updateTampilanKeranjang();
        ambilDataMenu();
        cekStatusWarungDB();
    </script>
</body>
</html>
