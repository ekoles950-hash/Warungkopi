<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Basecamp Coffee - Kasir</title>
    <style>
        body { background: #efebe9; color: #3e2723; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #d7ccc8; border: 3px solid #8d6e63; border-radius: 12px; padding: 25px; max-width: 420px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .instruksi { font-size: 18px; font-weight: bold; color: #4e342e; text-align: left; margin-bottom: 8px; margin-top: 15px;}
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; background: #fff; color: #3e2723; border: 2px solid #a1887f; border-radius: 8px; font-weight: bold; font-size: 18px; box-sizing: border-box; }
        
        /* Tombol Utama */
        button { width: 100%; background: #5d4037; color: #fff; border: none; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 10px; }
        button:active { transform: scale(0.95); }
        
        /* Layout Tombol Cepat */
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-cepat { background: #795548; font-size: 16px; padding: 12px; margin-top: 0; }
        
        #pesan_status { display: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
        .garis-pembatas { border-top: 2px dashed #a1887f; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #3e2723; margin-top:0;">☕ Warung Basecamp Coffee</h2>
        
        <!-- Tempat notifikasi sukses/gagal -->
        <div id="pesan_status"></div>

        <!-- ========================================== -->
        <!-- TOMBOL CEPAT (START & DAFTAR) -->
        <!-- ========================================== -->
        <div class="instruksi" style="margin-top: 0;">Tombol Pintasan:</div>
        <div class="btn-group">
            <button type="button" class="btn-cepat" id="btn_start">▶️ /start</button>
            <button type="button" class="btn-cepat" id="btn_daftar">📝 DAFTAR.123</button>
        </div>

        <div class="garis-pembatas"></div>

        <!-- ========================================== -->
        <!-- FORM TRANSAKSI UTAMA -->
        <!-- ========================================== -->
        <form id="formTransaksi">
            <div class="instruksi">Pilih Nominal Top-Up:</div>
            <select id="kode_produk" required>
                <option value="DN5">DANA 5.000 (DN5)</option>
                <option value="DN10">DANA 10.000 (DN10)</option>
                <option value="DN15">DANA 15.000 (DN15)</option>
                <option value="DN20">DANA 20.000 (DN20)</option>
                <option value="DN25">DANA 25.000 (DN25)</option>
                <option value="DN50">DANA 50.000 (DN50)</option>
            </select>
            
            <div class="instruksi">Masukkan Nomor Tujuan:</div>
            <input type="number" id="nomor_tujuan" placeholder="08...">
            
            <div class="instruksi">Masukkan PIN:</div>
            <input type="password" id="pin_trx" placeholder="PIN Transaksi" value="123" required>
            
            <button type="submit" id="btn_transaksi">☕ GAS PROSES TRANSAKSI</button>
        </form>
    </div>

    <script>
        // Data Bot Telegram
        const tokenBot = "8669740968:AAHp-f7iMVSSCyvuvbDbqlF0lJkOt71d7-E";
        const chatId = "5044338600";

        // Fungsi Utama Pengirim Pesan
        function kirimKeTelegram(pesanKirim, elemenTombol) {
            let statusDiv = document.getElementById("pesan_status");
            let teksTombolAsli = elemenTombol.innerHTML;
            let urlTelegram = "https://api.telegram.org/bot" + tokenBot + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(pesanKirim);

            // Ubah tombol jadi mode loading
            elemenTombol.innerHTML = "⏳ MENGIRIM...";
            elemenTombol.disabled = true;

            // Eksekusi pengiriman via jalur belakang (Background Fetch)
            fetch(urlTelegram)
                .then(response => response.json())
                .then(data => {
                    statusDiv.style.display = "block";
                    if (data.ok) {
                        statusDiv.style.background = "#d7ccc8";
                        statusDiv.style.color = "#3e2723";
                        statusDiv.style.border = "2px solid #8d6e63";
                        statusDiv.innerHTML = "✅ Pesan terkirim: <b>" + pesanKirim + "</b>";
                        
                        // Kosongkan kolom nomor HP JIKA yang dikirim adalah format transaksi
                        if(pesanKirim !== "/start" && pesanKirim !== "DAFTAR.123") {
                            document.getElementById("nomor_tujuan").value = "";
                        }
                    } else {
                        statusDiv.style.background = "#d32f2f";
                        statusDiv.style.color = "white";
                        statusDiv.style.border = "none";
                        statusDiv.innerHTML = "❌ Gagal: " + data.description;
                    }
                })
                .catch(error => {
                    statusDiv.style.display = "block";
                    statusDiv.style.background = "#d32f2f";
                    statusDiv.style.color = "white";
                    statusDiv.style.border = "none";
                    statusDiv.innerHTML = "❌ Error jaringan! Cek koneksi internet.";
                })
                .finally(() => {
                    // Kembalikan tombol ke bentuk semula
                    elemenTombol.innerHTML = teksTombolAsli;
                    elemenTombol.disabled = false;
                });
        }

        // Aksi ketika tombol /start ditekan
        document.getElementById("btn_start").addEventListener("click", function() {
            kirimKeTelegram("/start", this);
        });

        // Aksi ketika tombol DAFTAR.123 ditekan
        document.getElementById("btn_daftar").addEventListener("click", function() {
            kirimKeTelegram("DAFTAR.123", this);
        });

        // Aksi ketika form Transaksi Utama ditekan
        document.getElementById("formTransaksi").addEventListener("submit", function(event) {
            event.preventDefault(); // Mencegah web merefresh
            
            let kode = document.getElementById("kode_produk").value;
            let nomor = document.getElementById("nomor_tujuan").value;
            let pin = document.getElementById("pin_trx").value;
            
            // Validasi khusus untuk form
            if(nomor === "") {
                alert("Nomor Tujuan tidak boleh kosong untuk transaksi!");
                return;
            }

            let formatPesan = kode + "." + nomor + "." + pin;
            let tombolSubmit = document.getElementById("btn_transaksi");
            
            kirimKeTelegram(formatPesan, tombolSubmit);
        });
    </script>
</body>
</html>
