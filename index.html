<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Basecamp Coffee - Laporan</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4ece1; padding: 15px; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(93, 64, 55, 0.1); border-top: 5px solid #8B5A2B; }
    h2 { text-align: center; color: #5d4037; margin-bottom: 20px; border-bottom: 3px solid #8B5A2B; padding-bottom: 10px; }
    
    .item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .nama { font-weight: bold; font-size: 17px; color: #3e2723; text-transform: capitalize; }
    .detail { font-size: 14px; color: #6d4c41; margin-top: 3px; margin-bottom: 10px; display: block; }
    
    .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; transition: 0.2s; text-align: center; outline: none; }
    
    /* Warna tema kopi untuk tombol */
    .btn-lapor { background-color: #6d4c41; }
    .btn:active { transform: scale(0.95); opacity: 0.9; }
    .btn:disabled { background-color: #bcaaa4; cursor: not-allowed; }
    
    #loading { text-align: center; color: #8d6e63; font-style: italic; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Warung Basecamp Coffee</h2>
    
    <div style="text-align: center; color: #5d4037; margin-bottom: 20px; font-size: 15px;">
      Silakan klik <b>Kirim ke Web 1</b> untuk merekap tagihan ke dashboard utama.
    </div>

    <div id="loading">Menyeduh data dari Spreadsheet... ☕</div>
    <div id="listPelanggan"></div>
  </div>

  <script>
    // --- KONFIGURASI SUPABASE ---
    const supabaseUrl = 'https://wfcmhdqtoftuyfjtyfkk.supabase.co';
    const supabaseKey = 'sb_publishable_TE45MyojofIEUkZyvLkHmg_xnsk92Ld';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // --- SPREADSHEET URL ---
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV673nBl_6Wn_6eBjiJzoSQfHDn0VQRCNTGsjrdo2fLPFZenxVD1MBvatyIJ8mTGuZX58w5UI3uII9/pub?output=csv";

    // --- LOAD DATA (Menggunakan pola yang terbukti work di device Anda) ---
    Papa.parse(csvUrl, {
      download: true,
      complete: function(results) {
        document.getElementById('loading').style.display = 'none';
        tampilkanData(results.data.slice(1)); // Potong baris pertama (header)
      }
    });

    function tampilkanData(data) {
      const container = document.getElementById('listPelanggan');
      data.forEach(row => {
        if (!row[0]) return;
        
        const nama = row[0].trim();
        // Index kolom disesuaikan persis dengan kode Sengkuni Anda
        const idPel = row[2] ? row[2].trim() : "-";
        const harga = row[3] ? row[3].toString().replace(/[^0-9]/g, '') : "0";
        
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="info">
            <span class="nama">${nama}</span>
            <span class="detail">ID: ${idPel} | <b>Rp ${parseInt(harga).toLocaleString('id-ID')}</b></span>
          </div>
          <div class="actions">
            <button class="btn btn-lapor" onclick="laporKeSupabase('${nama}', '${harga}', this)">Kirim ke Web 1</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- FUNGSI PUSH DATA KE SUPABASE ---
    async function laporKeSupabase(nama, harga, btn) {
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      const { data, error } = await supabase
        .from('laporan_tagihan')
        .insert([{ 
          nama_klien: nama, 
          jumlah_tagihan: harga, 
          status: 'belum bayar' 
        }]);
      
      if (error) {
        alert("Gagal sinkronisasi: " + error.message);
        btn.innerText = "Kirim ke Web 1";
        btn.disabled = false;
      } else {
        btn.innerText = "Terkirim ke Admin ✅";
        btn.style.backgroundColor = "#4caf50"; // Berubah hijau saat berhasil
      }
    }
  </script>
</body>
</html>
