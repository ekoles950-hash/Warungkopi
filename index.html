<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Manager - Termux</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        <h1 class="text-xl font-bold text-center text-indigo-400">📶 Android WiFi Manager</h1>
        
        <!-- Status Card -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-sm text-slate-400 uppercase tracking-wider font-semibold">Status Koneksi</h2>
            <div id="status" class="mt-2 text-sm text-slate-300">Memuat status...</div>
        </div>

        <!-- Scan Button -->
        <button onclick="scanWifi()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl transition shadow-md">
            Scan Jaringan Wi-Fi Sekitar
        </button>

        <!-- Result List -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-sm text-slate-400 uppercase tracking-wider font-semibold mb-2">Daftar Wi-Fi</h2>
            <div id="wifi-list" class="space-y-2 text-sm text-slate-300">Tekan tombol scan di atas.</div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('http://localhost:3000/status');
                const data = await res.json();
                document.getElementById('status').innerHTML = `SSID: <b>${data.ssid || 'Tidak terhubung'}</b><br>BSSID: ${data.bssid || '-'}<br>Link Speed: ${data.link_speed_mbps || 0} Mbps`;
            } catch (err) {
                document.getElementById('status').innerText = 'Gagal terhubung ke backend Termux.';
            }
        }

        async function scanWifi() {
            document.getElementById('wifi-list').innerText = 'Memindai jaringan...';
            try {
                const res = await fetch('http://localhost:3000/scan');
                const networks = await res.json();
                let html = '';
                networks.forEach(net => {
                    html += `<div class="p-2 bg-slate-900 rounded border border-slate-700 flex justify-between items-center">
                        <div><b>${net.ssid}</b><br><span class="text-xs text-slate-400">Signal: ${net.rssi} dBm</span></div>
                        <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-1 rounded">Tersedia</span>
                    </div>`;
                });
                document.getElementById('wifi-list').innerHTML = html || 'Tidak ada jaringan ditemukan.';
            } catch (err) {
                document.getElementById('wifi-list').innerText = 'Gagal memindai jaringan.';
            }
        }

        fetchStatus();
    </script>
</body>
</html>
