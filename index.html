<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Basecamp Coffee - PPOB</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 30px; 
            max-width: 500px; 
            margin: auto; 
            background-color: #fcf9f2; 
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #4a3623;
        }
        
        /* Instruksi di atas input dengan teks lebih besar */
        .instruction-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a3623;
            margin-bottom: 10px;
            display: block;
        }
        
        input, button { 
            padding: 15px; 
            font-size: 1.1rem; 
            margin-bottom: 20px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        
        input:focus {
            outline: none;
            border-color: #6F4E37;
            box-shadow: 0 0 5px rgba(111, 78, 55, 0.5);
        }
        
        button { 
            background-color: #6F4E37; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 1.2rem;
        }
        button:disabled { background-color: #a38c7a; cursor: not-allowed; }
        
        #statusBox { 
            margin-top: 15px; 
            padding: 15px; 
            border-radius: 5px; 
            font-weight: bold; 
            display: none; 
            font-size: 1.1rem;
            text-align: center;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Warung Basecamp Coffee</h2>
        <p>Layanan Pembayaran Otomatis</p>
    </div>
    
    <form id="topupForm">
        <!-- Posisi instruksi diperjelas di atas kolom -->
        <label for="noHp" class="instruction-text">Silakan Masukkan Nomor DANA Anda:</label>
        <input type="number" id="noHp" placeholder="Misal: 08123456789" required>
        
        <button type="submit" id="submitBtn">Beli DANA 5000</button>
    </form>

    <div id="statusBox"></div>

    <script>
        document.getElementById('topupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const noHp = document.getElementById('noHp').value;
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Memproses Pesanan...';
            statusBox.style.display = 'block';
            statusBox.className = '';
            statusBox.innerText = 'Menghubungkan ke Kasir (Termux)...';

            try {
                // Nembak ke api/topup.js di Vercel
                const response = await fetch('/api/topup', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ noHp: noHp })
                });
                
                const data = await response.json();

                // Ngebaca format balasan dari Village Payment
                if (data.status === true) {
                    statusBox.className = 'success';
                    statusBox.innerText = "✅ Sukses: Transaksi sedang diproses server!";
                } else {
                    statusBox.className = 'error';
                    // Menangkap pesan error spesifik, misalnya "Saldo Tidak Mencukupi"
                    const pesanError = data.data && data.data.pesan ? data.data.pesan : (data.pesan || "Permintaan gagal diproses.");
                    statusBox.innerText = `❌ Gagal: ${pesanError}`;
                }
            } catch (error) {
                statusBox.className = 'error';
                statusBox.innerText = "❌ Putus koneksi. Cek apakah Termux dan Cloudflare Tunnel di HP masih nyala.";
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Beli DANA 5000';
            }
        });
    </script>
</body>
</html>
