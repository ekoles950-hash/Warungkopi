<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Basecamp Coffee - Order & Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: white; transition: 0.3s; }
        .input-dark:focus { border-color: #10B981; outline: none; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        .product-card { background: #1E293B; border: 2px solid #334155; cursor: pointer; transition: 0.3s; }
        .product-card.active { border-color: #10B981; background: #064E3B; }
        #toast-topup { visibility: hidden; min-width: 280px; background-color: #1E293B; color: #fff; text-align: center; border-radius: 20px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 13px; font-weight: 800; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        #toast-topup.show { visibility: visible; animation: slideUp 0.4s; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="toast-topup"></div>

    <div class="w-full max-w-md bg-[#1E293B] p-8 rounded-[2.5rem] shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold italic text-[#10B981] tracking-tighter">BASECAMP<span class="text-white"> COFFEE</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">Sengkuni Net & PT FAMILI</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest ml-1">Nomor WhatsApp Pelanggan</label>
                <input type="number" id="nomor_hp" placeholder="08xxxxxxxxxx" required
                    class="w-full p-5 rounded-2xl input-dark text-xl font-bold tracking-wider">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest ml-1">Pilih Menu / Layanan</label>
                <div class="space-y-3">
                    
                    <div onclick="pilihProduk('KOPI01', 'Kopi Hitam Basecamp', 5000)" id="card-KOPI01" class="product-card p-5 rounded-2xl flex justify-between items-center">
                        <div class="flex flex-col text-left">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Minuman</span>
                            <span class="font-black text-white">Kopi Hitam Basecamp</span>
                        </div>
                        <span class="text-sm font-black text-[#10B981]">Rp 5.000</span>
                    </div>

                    <div onclick="pilihProduk('VCH01', 'WiFi Sengkuni 24 Jam', 3000)" id="card-VCH01" class="product-card p-5 rounded-2xl flex justify-between items-center">
                        <div class="flex flex-col text-left">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Internet</span>
                            <span class="font-black text-white">WiFi Sengkuni 24 Jam</span>
                        </div>
                        <span class="text-sm font-black text-[#10B981]">Rp 3.000</span>
                    </div>

                </div>
            </div>

            <button onclick="kirimKeSupabase()" id="btn-submit"
                class="w-full bg-[#10B981] hover:bg-[#059669] text-white py-6 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl transition-all active:scale-95">
                PROSES PESANAN
            </button>
        </div>
    </div>

    <script>
        // Data Kunci Supabase Mas Eko
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let skuTerpilih = '';
        let namaProdukTerpilih = '';
        let hargaTerpilih = 0;

        function showToast(msg) {
            const t = document.getElementById("toast-topup");
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 4000);
        }

        function pilihProduk(sku, nama, harga) {
            skuTerpilih = sku;
            namaProdukTerpilih = nama;
            hargaTerpilih = harga;
            
            document.querySelectorAll('.product-card').forEach(card => card.classList.remove('active'));
            document.getElementById('card-' + sku).classList.add('active');
        }

        async function kirimKeSupabase() {
            const noHp = document.getElementById('nomor_hp').value.trim();

            if (!noHp) { return showToast("⚠️ Isi nomor WA dulu Mas Eko!"); }
            if (!skuTerpilih) { return showToast("⚠️ Pilih menunya dulu Bos!"); }

            const btn = document.getElementById('btn-submit');
            btn.innerText = "MENGIRIM...";
            btn.disabled = true;

            // Kita tembak tabel 'pesanan_ojek'
            const { data, error } = await sb.from('pesanan_ojek').insert([{
                nama_pembeli: 'Warung - ' + namaProdukTerpilih,
                no_wa: noHp,
                alamat_kirim: 'Kode Menu: ' + skuTerpilih,
                total_harga: hargaTerpilih,
                status: 'pending',
                metode_bayar: 'QRIS'
            }]).select();

            if (error) {
                // KELUARKAN PESAN ERROR DARI SUPABASE AGAR KELIHATAN SALAHNYA
                console.error(error);
                showToast("❌ Gagal! Error: " + error.message);
                btn.innerText = "PROSES PESANAN";
                btn.disabled = false;
            } else {
                showToast("✅ Mantap, Berhasil Masuk Supabase!");
                document.getElementById('nomor_hp').value = '';
                document.querySelectorAll('.product-card').forEach(card => card.classList.remove('active'));
                skuTerpilih = '';
                btn.innerText = "PROSES PESANAN";
                btn.disabled = false;
                
                // Bot Telegram Notifikasi Orderan
                const tokenOrder = '8669740968:AAE7WcWDDqKcj7V836fFYUaZmdcpwyuecVE';
                const chatId = '7933777456';
                const pesan = `🏪 *PESANAN BARU BASECAMP* 🏪\n\n👤 No WA: ${noHp}\n🍱 Menu: ${namaProdukTerpilih} (${skuTerpilih})\n💰 Total: Rp ${hargaTerpilih.toLocaleString('id-ID')}\n⚡ Status: PENDING`;
                
                fetch(`https://api.telegram.org/bot${tokenOrder}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(pesan)}&parse_mode=Markdown`);
            }
        }
    </script>
</body>
</html>
