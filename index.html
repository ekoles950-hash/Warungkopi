<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Basecamp Coffee - Top Up Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: white; transition: 0.3s; }
        .input-dark:focus { border-color: #3B82F6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .product-card { background: #1E293B; border: 2px solid #334155; cursor: pointer; transition: 0.3s; }
        .product-card.active { border-color: #3B82F6; background: #1E3A8A; }
        #toast-topup { visibility: hidden; min-width: 280px; background-color: #1E293B; color: #fff; text-align: center; border-radius: 20px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 12px; font-weight: 800; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        #toast-topup.show { visibility: visible; animation: slideUp 0.4s; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="toast-topup"></div>

    <div class="w-full max-w-md bg-[#1E293B] p-8 rounded-[2.5rem] shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold italic text-blue-500 tracking-tighter">BASECAMP<span class="text-white"> COFFEE</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">SENGKUNI NET & PT FAMILI</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest ml-1">Nomor HP Tujuan</label>
                <input type="number" id="nomor_hp" placeholder="08xxxxxxxxxx" required
                    class="w-full p-5 rounded-2xl input-dark text-xl font-bold tracking-wider">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest ml-1">Pilih Produk</label>
                <div class="space-y-3">
                    <div onclick="pilihProduk('GPY1', 'Gopay 1.000', 2050)" id="card-GPY1" class="product-card p-5 rounded-2xl flex justify-between items-center">
                        <div class="flex flex-col text-left">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Gopay</span>
                            <span class="font-black text-white">Gopay 1.000</span>
                        </div>
                        <span class="text-xs font-black text-blue-400">Rp 2.050</span>
                    </div>

                    <div onclick="pilihProduk('DANA1', 'Dana 1.000', 2000)" id="card-DANA1" class="product-card p-5 rounded-2xl flex justify-between items-center">
                        <div class="flex flex-col text-left">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Dana</span>
                            <span class="font-black text-white">Dana 1.000</span>
                        </div>
                        <span class="text-xs font-black text-blue-400">Rp 2.000</span>
                    </div>
                </div>
            </div>

            <a id="btn-submit" onclick="prosesTransaksiSakti(event)" href="#"
                class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-6 rounded-2xl font-black text-xs text-center uppercase tracking-[0.2em] shadow-xl transition-all active:scale-95">
                KIRIM TOP UP
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'https://lybwttrdybmgatvauxev.supabase.co/rest/v1/transaksi';
        const API_KEY = 'sb_publishable_g18NbVXV34s3Je_BOuoajA_dmOguJGi'; 

        let skuTerpilih = '';
        let namaProdukTerpilih = '';
        let hargaTerpilih = 0;

        function showToast(msg) {
            const t = document.getElementById("toast-topup");
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 4000);
        }

        function pilihProduk(sku, nama, harga) {
            skuTerpilih = sku;
            namaProdukTerpilih = nama;
            hargaTerpilih = harga;
            
            document.querySelectorAll('.product-card').forEach(card => card.classList.remove('active'));
            document.getElementById('card-' + sku).classList.add('active');
        }

        async function prosesTransaksiSakti(e) {
            const noHp = document.getElementById('nomor_hp').value.trim();

            if (!noHp) { e.preventDefault(); return showToast("⚠️ Isi nomor HP tujuan dulu Mas!"); }
            if (!skuTerpilih) { e.preventDefault(); return showToast("⚠️ Pilih produknya dulu Mas!"); }

            const btn = document.getElementById('btn-submit');
            btn.innerText = "MEMPROSES...";
            btn.style.pointerEvents = "none"; // Disable klik ganda

            const textPesan = `📱 *TOP UP BARU (BASECAMP COFFEE)* 📱\n\n🎯 *No Tujuan:* ${noHp}\n📦 *Produk:* ${namaProdukTerpilih} (${skuTerpilih})\n💵 *Harga:* Rp ${hargaTerpilih.toLocaleString('id-ID')}\n⚡ *Status:* PENDING\n\n_Sengkuni Net & PT FAMILI_`;
            const urlWhatsApp = `https://wa.me/6281313726330?text=${encodeURIComponent(textPesan)}`;

            // Pasang link WA langsung ke href tombol biar dibuka secara alami oleh browser
            btn.href = urlWhatsApp;
            btn.target = "_blank";

            try {
                // Tembak data ke Supabase (karena RLS sudah disabled, ini langsung tembus)
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        nomor_hp: noHp,
                        produk: namaProdukTerpilih + ' (' + skuTerpilih + ')',
                        harga: hargaTerpilih,
                        status: 'pending'
                    })
                });

                showToast("✅ Masuk Database & Membuka WA!");
                setTimeout(() => { resetForm(); }, 1000);

            } catch (err) {
                // Proteksi Cadangan: kalau koneksi internet atau CORS ngadat, browser tetep bakal buka WA lewat href alami tadi
                showToast("⚡ Membuka WA Bisnis...");
                setTimeout(() => { resetForm(); }, 1000);
            }
        }

        function resetForm() {
            document.getElementById('nomor_hp').value = '';
            document.querySelectorAll('.product-card').forEach(card => card.classList.remove('active'));
            skuTerpilih = '';
            const btn = document.getElementById('btn-submit');
            btn.innerText = "KIRIM TOP UP";
            btn.href = "#";
            btn.removeAttribute("target");
            btn.style.pointerEvents = "auto";
        }
    </script>
</body>
</html>
