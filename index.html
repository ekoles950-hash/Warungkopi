<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Warung Kopi Siap Antar & Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        /* Animasi */
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: white; transition: 0.3s; }
        .wallet-card { background: #1E293B; border: 2px solid #334155; cursor: pointer; transition: 0.3s; width: 100%; }
        .nominal-card { background: #1E293B; border: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        .nominal-card.active { border-color: #10B981; background: #064E3B; }
    </style>
</head>
<body class="bg-stone-100 pb-24">

    <!-- LOGIN -->
    <div id="halaman-login" class="hidden fixed inset-0 bg-[#0F172A] z-[200] flex justify-center items-center p-5">
        <div class="bg-[#1E293B] w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl border border-slate-800 text-center">
            <h1 class="text-2xl font-black text-white mb-6">BASECAMP COFFEE</h1>
            <input type="text" id="input-nama-login" class="w-full p-4 rounded-xl input-dark text-center mb-5" placeholder="Nama Anda...">
            <button onclick="prosesLoginUser()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black">MASUK</button>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg border border-stone-200 relative">
        <div class="bg-[#292524] p-4 text-center border-b-4 border-[#d97706]">
            <h1 class="text-lg font-extrabold text-[#f59e0b]">WARUNG KOPI SIAP ANTAR</h1>
        </div>

        <div class="p-4" id="halaman-beranda">
            <!-- DASHBOARD BOX (STRUKTUR DIPERBAIKI) -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 mb-4 flex justify-between items-center text-[10px]">
                <div class="text-left"><span class="text-[7px] text-stone-400 font-bold uppercase">Akun</span><div id="lbl-nama-beranda" class="font-bold text-stone-800">-</div></div>
                <div class="text-right"><span class="block text-[7px] text-stone-400 font-bold uppercase">Tagihan</span><span id="lbl-tagihan-beranda" class="text-red-600 font-black text-[10px]">Rp 0</span></div>
                <div class="text-right"><span class="block text-[7px] text-stone-400 font-bold uppercase">Saldo</span><span id="lbl-saldo-beranda" class="text-amber-600 font-black text-[10px]">Rp 0</span></div>
                <div class="text-right"><span class="block text-[7px] text-stone-400 font-bold uppercase">Koin</span><span id="lbl-koin-beranda" class="text-emerald-600 font-black text-[10px]">0</span></div>
            </div>

            <h2 class="text-lg font-bold text-stone-800 mb-3">Daftar Menu</h2>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- HALAMAN TOP UP (DIPERBAIKI STRUKTURNYA) -->
        <div class="p-4 hidden" id="halaman-topup">
            <div class="bg-[#1E293B] p-4 rounded-2xl mb-4 flex justify-between items-center text-white text-[10px]">
                <div class="text-left">Akun:<div id="lbl-nama-topup">-</div></div>
                <div class="text-right">Tagihan:<div id="lbl-tagihan-topup" class="text-red-400">Rp 0</div></div>
                <div class="text-right">Saldo:<div id="lbl-saldo-topup" class="text-blue-400">Rp 0</div></div>
                <div class="text-right">Koin:<div id="lbl-koin-topup" class="text-emerald-400">0</div></div>
            </div>
            <div id="pilih-dompet-container" class="grid grid-cols-2 gap-3">
                <div onclick="pilihEWallet('DANA', 'DANA')" class="wallet-card p-4 rounded-2xl text-center text-white">DANA</div>
            </div>
            <div id="form-input-dinamis" class="hidden"></div>
        </div>

        <!-- NAVIGASI BAWAH -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] text-white flex justify-around p-4 rounded-t-3xl z-40">
            <button onclick="bukaLacak()">🔍 Lacak</button>
            <button onclick="bukaBeranda()">🏠 Beranda</button>
            <button onclick="bukaTopUp()">💳 Top Up</button>
            <button onclick="bukaKeranjang()">🛒 Keranjang</button>
        </div>
    </div>

    <script>
        // SCRIPT ENGINE (DISESUAIKAN DENGAN NAMA KOLOM "Total hutang" (tanpa spasi di script) atau "hutang")
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function muatDataPelanggan(nama) {
            try {
                const { data } = await clientDB.from('pelanggan').select('*').eq('nama', nama).single();
                if (data) {
                    // MENGAMBIL DATA HUTANG DARI KOLOM 'Total hutang' (Pastikan SQL sudah benar)
                    let hutang = parseInt(data['Total hutang']) || 0;
                    document.getElementById('lbl-nama-beranda').innerText = data.nama;
                    document.getElementById('lbl-tagihan-beranda').innerText = `Rp ${hutang.toLocaleString()}`;
                    document.getElementById('lbl-saldo-beranda').innerText = `Rp ${data.saldo.toLocaleString()}`;
                    document.getElementById('lbl-koin-beranda').innerText = data.koin;
                    
                    document.getElementById('lbl-nama-topup').innerText = data.nama;
                    document.getElementById('lbl-tagihan-topup').innerText = `Rp ${hutang.toLocaleString()}`;
                    document.getElementById('lbl-saldo-topup').innerText = `Rp ${data.saldo.toLocaleString()}`;
                    document.getElementById('lbl-koin-topup').innerText = data.koin;
                }
            } catch (e) { console.error(e); }
        }

        async function kirimTopUp() {
            try {
                const { data } = await clientDB.from('pelanggan').select('saldo, "Total hutang"').eq('nama', loggedInUser).single();
                let hutang = parseInt(data['Total hutang']) || 0;
                if (hutang >= 100000) {
                    alert("Top Up Gagal! Hutang sudah mencapai limit Rp 100.000.");
                    return;
                }
                // Lanjutkan proses top up...
            } catch (err) { alert("Gagal validasi hutang."); }
        }
        
        // Panggil fungsi awal
        const loggedInUser = localStorage.getItem('namaPelangganBasecamp');
        if(loggedInUser) muatDataPelanggan(loggedInUser);
    </script>
</body>
</html>
