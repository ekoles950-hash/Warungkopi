<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Warung Kopi Siap Antar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-stone-100 pb-24">

    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 z-[100] transition-all duration-300 pointer-events-none w-[90%] max-w-sm">
        <div id="toast-content" class="px-6 py-3 rounded-full shadow-2xl text-sm font-bold text-white flex items-center justify-center gap-2 bg-stone-800"></div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden border border-stone-200 relative">
        
        <div class="bg-[#292524] text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-[#d97706]" id="header-utama">
            <h1 class="text-xl font-extrabold text-center text-[#f59e0b]">☕WARUNG KOPI SIAP ANTAR</h1>
        </div>

        <div class="p-4 bg-stone-50 min-h-screen" id="halaman-beranda">
            <h2 class="text-lg font-bold text-stone-800 mb-3">Daftar Menu</h2>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div class="min-h-screen bg-[#131722] text-white p-5 flex-col items-center pt-8 pb-24 hidden" id="halaman-lacak-visual">
            <h1 id="teks-status-lacak" class="text-2xl font-extrabold text-white mb-10 text-center">MENCARI...</h1>
            <button onclick="bukaBeranda()" class="w-full py-4 bg-gray-800 rounded-xl font-bold">KEMBALI</button>
        </div>

        <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl shadow-2xl animate-[slideUp_0.3s_ease-out] max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-stone-800">Keranjang</h2>
                    <button onclick="tutupCheckout()" class="text-stone-400 font-bold text-3xl">&times;</button>
                </div>
                <div id="daftar-pesanan-checkout" class="overflow-y-auto hide-scroll flex-grow"></div>
                <div class="border-t pt-4 mt-2">
                    <div class="flex justify-between font-bold text-lg mb-4"><span>Total:</span><span id="total-harga-checkout">Rp 0</span></div>
                    <input type="text" id="nama-pemesan" class="w-full border-2 rounded-xl p-3 mb-4 font-bold" placeholder="Ketik nama pemesan...">
                    <button onclick="kirimPesananKopi()" class="w-full bg-[#d97706] text-white font-extrabold py-3.5 rounded-xl">Kirim Pesanan</button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] text-white z-40 flex justify-around items-center px-4 py-3 rounded-t-3xl">
            <button onclick="bukaModalLacak()" class="flex flex-col items-center">🔍<span class="text-[9px]">LACAK</span></button>
            <button onclick="bukaBeranda()" class="flex flex-col items-center">🏠<span class="text-[9px]">BERANDA</span></button>
            <button onclick="tampilkanNotifikasi('Fitur Top Up tidak tersedia')" class="flex flex-col items-center">💳<span class="text-[9px]">OFF</span></button>
            <button onclick="bukaCheckout()" class="flex flex-col items-center">🛒<span class="text-[9px]">KERANJANG</span><span id="jumlah-item-bawah" class="absolute -top-1 right-20 bg-red-500 text-[10px] px-1.5 rounded-full hidden">0</span></button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let keranjang = JSON.parse(localStorage.getItem('keranjangWarungBasecamp')) || [];

        function tampilkanNotifikasi(pesan) {
            const toast = document.getElementById('toast');
            toast.classList.remove('-translate-y-24', 'opacity-0');
            document.getElementById('toast-content').innerHTML = pesan;
            setTimeout(() => { toast.classList.add('-translate-y-24', 'opacity-0'); }, 3000);
        }

        function updateTampilanKeranjang() {
            const badge = document.getElementById('jumlah-item-bawah');
            const listArea = document.getElementById('daftar-pesanan-checkout');
            if (keranjang.length === 0) { badge.classList.add('hidden'); listArea.innerHTML = `<div class="text-center py-6">Kosong</div>`; return; }
            badge.classList.remove('hidden');
            let qty = 0, total = 0, html = '';
            keranjang.forEach(item => {
                qty += item.jumlah; total += item.harga * item.jumlah;
                html += `
                    <div class="flex justify-between items-center py-3 border-b">
                        <span class="font-bold truncate w-1/2">${item.nama}</span>
                        <div class="flex items-center gap-3">
                            <button onclick="ubahJumlah('${item.nama}', -1)" class="bg-stone-200 w-8 h-8 rounded-full">-</button>
                            <span class="w-4 text-center font-bold">${item.jumlah}</span>
                            <button onclick="ubahJumlah('${item.nama}', 1)" class="bg-[#d97706] text-white w-8 h-8 rounded-full">+</button>
                        </div>
                    </div>`;
            });
            badge.innerText = qty; listArea.innerHTML = html; document.getElementById('total-harga-checkout').innerText = `Rp ${total.toLocaleString()}`;
        }

        function ubahJumlah(nama, perubahan) {
            const index = keranjang.findIndex(i => i.nama === nama);
            if (index !== -1) {
                keranjang[index].jumlah += perubahan;
                if (keranjang[index].jumlah <= 0) keranjang.splice(index, 1);
                localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang));
                updateTampilanKeranjang();
            }
        }

        function tambahKeKeranjang(nama, harga) {
            const itemAda = keranjang.find(item => item.nama === nama);
            if (itemAda) itemAda.jumlah += 1; else keranjang.push({ nama, harga, jumlah: 1 });
            localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang));
            updateTampilanKeranjang(); tampilkanNotifikasi("Ditambahkan!");
        }

        // Fungsi lainnya (bukaCheckout, tutupCheckout, bukaModalLacak, tutupModalLacak, cariPesanan, kirimPesananKopi, bukaBeranda, loadMenu)
        // Dibiarkan berjalan seperti fungsi Anda sebelumnya.
        
        async function loadMenu() {
            const { data } = await clientDB.from('menu_warung').select('*');
            if (data) {
                document.getElementById('ruang-menu').innerHTML = data.map(item => `
                    <div class="bg-white p-3 rounded-xl border">
                        <img src="${item.foto_url}" class="w-full h-24 object-cover rounded">
                        <h3 class="font-bold text-sm mt-2">${item.nama_menu}</h3>
                        <p class="text-[#d97706] font-bold">Rp ${item.harga.toLocaleString()}</p>
                        <button onclick="tambahKeKeranjang('${item.nama_menu.replace(/'/g, "\\'")}', ${item.harga})" class="w-full bg-[#d97706] text-white py-2 rounded-lg mt-2 text-xs">BELI</button>
                    </div>`).join('');
            }
        }

        updateTampilanKeranjang(); loadMenu();
    </script>
</body>
</html>
