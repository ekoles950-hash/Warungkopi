<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Warung Basecamp Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; }
        .wallet-card { background: #1E293B; border: 2px solid #334155; }
        .nominal-card { background: #1E293B; border: 1px solid #475569; }
        .nominal-card.active { border-color: #10B981; background: #064E3B; }
    </style>
</head>
<body class="p-4 pb-20">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center text-blue-500 mb-6">TOP UP DELIVERY</h1>

        <!-- LAYANAN -->
        <div id="pilih-dompet" class="grid grid-cols-2 gap-3">
            <div onclick="pilihLayanan('SHP', 'Shopee.png', 'ShopeePay')" class="wallet-card p-4 rounded-xl flex flex-col items-center cursor-pointer"><img src="Shopee.png" class="w-12 h-12 mb-2"><span>ShopeePay</span></div>
            <div onclick="pilihLayanan('GPY', 'Gopay.png', 'Gopay')" class="wallet-card p-4 rounded-xl flex flex-col items-center cursor-pointer"><img src="Gopay.png" class="w-12 h-12 mb-2"><span>Gopay</span></div>
            <div onclick="pilihLayanan('D', 'Dana.png', 'DANA')" class="wallet-card p-4 rounded-xl flex flex-col items-center cursor-pointer"><img src="Dana.png" class="w-12 h-12 mb-2"><span>DANA</span></div>
            <div onclick="pilihLayanan('OVO', 'Ovo.png', 'OVO')" class="wallet-card p-4 rounded-xl flex flex-col items-center cursor-pointer"><img src="Ovo.png" class="w-12 h-12 mb-2"><span>OVO</span></div>
            <div onclick="pilihLayanan('PLN', 'Token listrik.png', 'PLN')" class="wallet-card p-4 rounded-xl flex flex-col items-center cursor-pointer"><img src="Token listrik.png" class="w-12 h-12 mb-2"><span>PLN</span></div>
        </div>

        <!-- FORM -->
        <div id="form-topup" class="hidden mt-6 space-y-4">
            <button onclick="location.reload()" class="text-blue-400 font-bold">← Kembali</button>
            <input type="text" id="nama" placeholder="Nama Pelanggan" class="w-full p-4 bg-slate-800 rounded-xl">
            <input type="text" id="tujuan" placeholder="Nomor Tujuan" class="w-full p-4 bg-slate-800 rounded-xl">
            <div id="list-nominal" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>

    <!-- MODAL KONFIRMASI -->
    <div id="modal-konfirmasi" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm text-center">
            <h2 class="text-white font-bold mb-4">Konfirmasi Pembayaran</h2>
            <p id="info-pesanan" class="text-slate-300 text-sm mb-6"></p>
            <div class="flex gap-2">
                <button onclick="tutupModal()" class="flex-1 p-3 bg-red-600 rounded-xl font-bold">Batal</button>
                <button onclick="eksekusiKirim()" class="flex-1 p-3 bg-green-600 rounded-xl font-bold">Ya, Bayar</button>
            </div>
        </div>
    </div>

    <script>
        let sku = '', labelInfo = '';

        // NAVIGASI TOP UP EKSTERNAL
        function bukaTopUp() {
            window.location.href = 'https://grabwarung.mkz.my.id/';
        }

        function pilihLayanan(id, img, label) {
            document.getElementById('pilih-dompet').classList.add('hidden');
            document.getElementById('form-topup').classList.remove('hidden');
            let list = document.getElementById('list-nominal');
            list.innerHTML = '';
            
            let daftar = [];
            if(id=='D') {
                daftar = [{c:'DN1', l:'1rb', m:1000}, {c:'DN2', l:'2rb', m:2000}, {c:'DN5', l:'5rb', m:5000}, {c:'DN10', l:'10rb', m:10000}, {c:'DN25', l:'25rb', m:25000}, {c:'DN50', l:'50rb', m:50000}, {c:'DN100', l:'100rb', m:100000}];
            } else if(id=='GPY') {
                daftar = [{c:'GPY10', l:'10rb', m:10000}, {c:'GPY20', l:'20rb', m:20000}, {c:'GPY50', l:'50rb', m:50000}, {c:'GPY100', l:'100rb', m:100000}];
            } else if(id=='OVO') {
                daftar = [{c:'OVP10', l:'10rb', m:10000}, {c:'OVP25', l:'25rb', m:25000}, {c:'OVP50', l:'50rb', m:50000}];
            } else if(id=='SHP') {
                daftar = [{c:'QSPAY10', l:'10rb', m:10000}, {c:'QSPAY50', l:'50rb', m:50000}, {c:'QSPAY100', l:'100rb', m:100000}];
            } else if(id=='PLN') {
                daftar = [{c:'PLNPH2H3', l:'20rb', m:20000}, {c:'PLNPH2H5', l:'50rb', m:50000}];
            }

            daftar.forEach(item => {
                let untung = (item.m < 15000) ? 2000 : 5000;
                let hrgJual = item.m + untung;
                list.innerHTML += `
                    <div onclick="sku='${item.c}'; labelInfo='${item.l}'; document.querySelectorAll('.nominal-card').forEach(c=>c.classList.remove('active')); this.classList.add('active'); tampilkanKonfirmasi()" 
                         class="nominal-card p-3 rounded-lg text-center cursor-pointer">
                         <div class="font-bold">${item.l}</div>
                         <div class="text-emerald-400 text-xs">Rp ${hrgJual.toLocaleString()}</div>
                    </div>`;
            });
        }

        function tampilkanKonfirmasi() {
            let nama = document.getElementById('nama').value;
            let tujuan = document.getElementById('tujuan').value;
            if(!nama || !tujuan) return alert("Isi Nama & Tujuan dulu!");
            document.getElementById('info-pesanan').innerText = `Produk: ${labelInfo}\nTujuan: ${tujuan}\nNama: ${nama}`;
            document.getElementById('modal-konfirmasi').classList.remove('hidden');
        }

        function tutupModal() { document.getElementById('modal-konfirmasi').classList.add('hidden'); }

        function eksekusiKirim() {
            let f = document.createElement('form');
            f.action = 'topup.php'; f.method = 'POST';
            f.innerHTML = `<input name="produk" value="${sku}"><input name="tujuan" value="${document.getElementById('tujuan').value}"><input name="nama" value="${document.getElementById('nama').value}">`;
            document.body.appendChild(f); f.submit();
        }
    </script>
</body>
</html>
