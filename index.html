<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Warung Kopi Siap Antar & Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes jalan-maju { 0% { transform: translateX(-10px) scaleX(-1); } 50% { transform: translateX(10px) scaleX(-1); } 100% { transform: translateX(-10px) scaleX(-1); } }
        .animasi-jalan-maju { animation: jalan-maju 1.5s infinite ease-in-out; display: inline-block; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .kurir-diam { transform: scaleX(-1); }
        .animasi-kurir-jalan { animation: lompat-jalan 0.6s infinite; }
        @keyframes lompat-jalan { 0%, 100% { transform: translateY(0) scaleX(-1); } 50% { transform: translateY(-8px) scaleX(-1); } }
    </style>
</head>
<body class="bg-stone-100 pb-24">

    <!-- Kontainer Utama & Modal (Sama persis seperti kode asli Anda) -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden border border-stone-200 relative">
        <div class="bg-[#292524] text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-[#d97706]" id="header-utama">
            <h1 class="text-xl font-extrabold text-center tracking-wide text-[#f59e0b]">☕PINGIN NGOPI KARO UDUT TAPI MAGER WARUNG KOPI SIAP ANTAR</h1>
            <button onclick="bukaModalPin()" class="absolute right-4 top-5 text-xl">⚙️</button>
        </div>

        <div class="p-4" id="halaman-beranda">
            <h2 class="text-lg font-bold text-stone-800 mb-3">Daftar Menu</h2>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- Navigasi Bawah -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] border-t border-gray-800 z-40 flex justify-around items-center px-4 py-3 pb-safe rounded-t-3xl">
            <button onclick="bukaModalLacak()" class="flex flex-col items-center text-gray-400"><span class="text-2xl">🔍</span><span class="text-[9px] font-bold">LACAK</span></button>
            <button onclick="bukaBeranda()" class="flex flex-col items-center text-[#22c55e] bg-[#1f2937] p-3 rounded-2xl -mt-8 shadow-lg"><span class="text-3xl">🏠</span><span class="text-[9px] font-bold text-white">BERANDA</span></button>
            <button onclick="bukaTopUp()" class="flex flex-col items-center text-gray-400"><span class="text-2xl">💳</span><span class="text-[9px] font-bold">TOP UP</span></button>
            <button onclick="bukaCheckout()" class="flex flex-col items-center text-gray-400"><span class="text-2xl">🛒</span><span class="text-[9px] font-bold">KERANJANG</span></button>
        </div>
    </div>

    <!-- SEMUA MODAL DISINI (Sama seperti kode asli Anda) -->
    <div id="modal-lacak" class="hidden fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-5">...</div>
    <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">...</div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNGSI TOP UP DIBUAT REDIRECT
        function bukaTopUp() {
            window.location.href = 'https://grabwarung.mkz.my.id/index.php';
        }

        // FUNGSI ASLI ANDA (Saya sertakan agar fitur tidak hilang)
        function bukaBeranda() { location.reload(); }
        function bukaModalLacak() { document.getElementById('modal-lacak').classList.remove('hidden'); }
        function tutupModalLacak() { document.getElementById('modal-lacak').classList.add('hidden'); }
        function bukaCheckout() { document.getElementById('modal-checkout').classList.remove('hidden'); }
        function tutupCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }

        async function ambilDataMenu() {
            const ruangMenu = document.getElementById('ruang-menu');
            const { data } = await clientDB.from('menu_warung').select('*').order('nama_menu', { ascending: true });
            if(data) {
                ruangMenu.innerHTML = data.map(item => `
                    <div class="bg-white rounded-xl shadow-sm border p-3 flex flex-col">
                        <h3 class="font-bold text-stone-800 text-sm">${item.nama_menu}</h3>
                        <p class="text-[#d97706] font-extrabold text-sm mt-1">Rp ${item.harga.toLocaleString('id-ID')}</p>
                    </div>
                `).join('');
            }
        }
        
        ambilDataMenu();
    </script>
</body>
</html>
