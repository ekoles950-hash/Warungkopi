<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabndeso Payment</title>
    <style>
        body { font-family:sans-serif; text-align:center; padding:20px; background:#0F172A; color: white; margin:0; }
        .card { background:#1E293B; padding:25px; border-radius:30px; border-top:8px solid #10B981; max-width:400px; margin:auto; box-shadow:0 25px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color:#10B981; margin-bottom:5px; font-weight: 800; }
        .tagline { font-weight: bold; color: #94A3B8; margin-bottom: 10px; font-size: 18px; }
        .input-nominal, .input-wa { width:100%; padding:15px; font-size:18px; margin:10px 0 15px 0; border:2px solid #334155; border-radius:15px; box-sizing:border-box; text-align:center; font-weight:bold; background:#0F172A; color: #10B981; }
        .input-nominal { font-size:22px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-pay { width:100%; padding:16px; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; font-size:13px; text-transform: uppercase; }
        .qris { background: #10B981; }
        .dana { background: #118eea; }
        .ovo  { background: #4c2a86; }
        .shopee { background: #ee4d2d; }
        .va   { background: #007bff; }
        .section-label { text-align: left; font-size: 11px; color: #64748B; margin-top: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .field-label { text-align: left; font-size: 14px; color: #94A3B8; margin-bottom: 2px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>GRAB<span style="color:white">NDESO</span></h1>
        <div class="tagline">YUK BAYAR</div>
        
        <!-- Ganti action="proses.php" dengan URL file PHP backend Anda -->
        <form action="proses.php" method="POST">
            
            <div class="field-label">Total Tagihan Pesanan Anda:</div>
            <!-- Atribut 'readonly' dihapus agar nominal bisa diketik manual di HTML murni -->
            <input type="number" name="nominal" class="input-nominal" placeholder="Contoh: 50000" required>
            
            <div class="field-label">Nomor WhatsApp:</div>
            <!-- Mengubah input hidden menjadi input text biasa agar pelanggan bisa mengisi nomor HP -->
            <input type="text" name="customer_phone" class="input-wa" placeholder="Contoh: 081234567890" required>
            
            <div class="btn-group">
                <div class="section-label">E-Wallet & QRIS</div>
                <button type="submit" name="method" value="QRIS" class="btn-pay qris">BAYAR VIA QRIS</button>
                <button type="submit" name="submit_ovo" value="OVO" class="btn-pay ovo">BAYAR VIA OVO (PUSH)</button>
                <button type="submit" name="method" value="DANA" class="btn-pay dana">BAYAR VIA DANA</button>
                <button type="submit" name="method" value="SHOPEEPAY" class="btn-pay shopee">BAYAR VIA SHOPEEPAY</button>
                
                <div class="section-label">Virtual Account Bank</div>
                <button type="submit" name="method" value="BRIVA" class="btn-pay va">BRI VIRTUAL ACCOUNT</button>
                <button type="submit" name="method" value="BCAVA" class="btn-pay va">BCA VIRTUAL ACCOUNT</button>
                <button type="submit" name="method" value="BNIVA" class="btn-pay va">BNI VIRTUAL ACCOUNT</button>
            </div>
        </form>
    </div>
</body>
</html>
