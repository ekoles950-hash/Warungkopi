<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Admin Dashboard - Approval Saldo Basecamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen pb-12">

    <!-- Gembok Keamanan PIN Admin -->
    <div id="gembok-admin" class="fixed inset-0 bg-slate-950 z-[300] flex justify-center items-center p-5">
        <div class="bg-[#1E293B] w-full max-w-sm rounded-[2rem] p-6 shadow-2xl border border-slate-800 text-center">
            <h2 class="text-xl font-black italic text-blue-500 mb-1">KASIR BASECAMP 🔒</h2>
            <p class="text-slate-400 text-xs mb-4">Masukkan PIN untuk mengelola saldo pelanggan</p>
            <input type="password" id="pin-kasir" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-2xl tracking-[0.5em] mb-4 outline-none text-white focus:border-blue-500" placeholder="••••">
            <button onclick="masukDashboardAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg transition">BUKA DASHBOARD</button>
        </div>
    </div>

    <!-- Konten Utama Dashboard -->
    <div class="max-w-md mx-auto p-4 hidden" id="konten-admin">
        
        <!-- Header -->
        <div class="bg-[#1E293B] p-5 rounded-[2rem] shadow-xl border border-slate-800 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black text-white italic tracking-wide">APPROVAL SALDO</h1>
                <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Status: Kasir Online 🟢</p>
            </div>
            <button onclick="logoutAdmin()" class="text-xs font-black bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl hover:bg-red-500 hover:text-white transition">LOGOUT</button>
        </div>

        <!-- Area Antrean List -->
        <div class="space-y-4">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] ml-2">📥 Antrean Deposit (Pending)</h2>
            
            <div id="container-antrean-saldo" class="space-y-3">
                <!-- Data antrean otomatis disuntik lewat JavaScript di bawah -->
                <div class="text-center text-slate-600 py-12 text-sm font-bold">Memuat antrean saldo gaib...</div>
            </div>
        </div>

    </div>

    <script>
        // SINKRONISASI KUNCI SUPABASE SAMA DENGAN APLIKASI UTAMAMU
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const kasirDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const PIN_AKSES = '1234'; // PIN Akses Kasir Mas Eko

        // 1. Logika Gembok Login Admin
        function masukDashboardAdmin() {
            const inputPin = document.getElementById('pin-kasir').value;
            if (inputPin === PIN_AKSES) {
                document.getElementById('gembok-admin').classList.add('hidden');
                document.getElementById('konten-admin').classList.remove('hidden');
                muatAntreanDepositMandiri();
            } else {
                alert("PIN Kasir Salah! Akses ditolak.");
                document.getElementById('pin-kasir').value = '';
                document.getElementById('pin-kasir').focus();
            }
        }

        function logoutAdmin() {
            document.getElementById('pin-kasir').value = '';
            document.getElementById('gembok-admin').classList.remove('hidden');
            document.getElementById('konten-admin').classList.add('hidden');
        }

        // 2. Fungsi Mengambil Data Antrean Pending dari Supabase
        async function muatAntreanDepositMandiri() {
            const container = document.getElementById('container-antrean-saldo');
            if (!container) return;

            try {
                const { data, error } = await kasirDB.from('topup_saldo').select('*').eq('status', 'Pending').order('created_at', { ascending: true });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="bg-[#1E293B]/40 border border-slate-800/60 p-8 rounded-2xl text-center text-slate-500 font-bold text-xs uppercase tracking-wider">
                            ☕ Antrean bersih! Belum ada pelanggan yang transfer.
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                data.forEach(item => {
                    const jam = new Date(item.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    
                    // Setel warna logo sesuai metode bayar biar gampang dibedakan mata
                    let warnaLogo = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                    if (metodeBadge(item.metode_bayar) === 'QRIS') warnaLogo = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                    else if (metodeBadge(item.metode_bayar) === 'GOPAY') warnaLogo = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    else if (metodeBadge(item.metode_bayar) === 'SHOPEE') warnaLogo = 'bg-orange-500/10 text-orange-400 border-orange-500/20';

                    container.innerHTML += `
                        <div class="bg-[#1E293B] p-4 rounded-2xl border border-slate-800 shadow-md flex flex-col gap-3 animate-[slideUp_0.2s_ease-out]">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 ${warnaLogo} rounded-xl border flex items-center justify-center font-black text-xs tracking-tighter">
                                        ${metodeBadge(item.metode_bayar)}
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="font-black text-white text-base">${item.nama_pelanggan}</span>
                                        <span class="text-[10px] text-slate-400 font-medium">Jam Kirim: ${jam} WIB</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-[9px] font-black uppercase text-slate-400 tracking-wider block">Nominal</span>
                                    <span class="font-black text-yellow-400 text-base">Rp ${item.nominal.toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                            
                            <!-- Tombol Eksekusi Cepat -->
                            <div class="grid grid-cols-2 gap-2 mt-1 border-t border-slate-800/80 pt-3">
                                <button onclick="tolakDepositPelanggan('${item.id}', this)" class="w-full bg-red-500/10 hover:bg-red-600 border border-red-500/20 hover:border-red-600 text-red-400 hover:text-white py-2.5 rounded-xl font-bold text-xs uppercase tracking-wide transition">
                                    ❌ TOLAK
                                </button>
                                <button onclick="setujuiDepositPelanggan('${item.id}', this)" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-2.5 rounded-xl font-black text-xs uppercase tracking-wide shadow-md transition">
                                    ✔ SUKSES (APPROVE)
                                </button>
                            </div>
                        </div>`;
                });
            } catch (err) {
                container.innerHTML = `<div class="text-center text-red-400 font-bold text-xs">Gagal memuat database antrean!</div>`;
            }
        }

        function metodeBadge(str) {
            if (str.includes('QRIS')) return 'QRIS';
            if (str.includes('DANA')) return 'DANA';
            if (str.includes('GOPAY')) return 'GPY';
            if (str.includes('SHOPEE')) return 'SPP';
            return 'TRF';
        }

        // 3. TOMBOL SEKSES: Sekali klik ganti status di Supabase & otomatis isi saldo ke pelanggan
        async function setujuiDepositPelanggan(id, buttonElement) {
            if (!confirm("Apakah uang asli beneran sudah masuk di mutasi DANA/QRIS milikmu, Mas?")) return;

            buttonElement.innerText = "PROCESSING...";
            buttonElement.disabled = true;

            try {
                // Update status antrean menjadi 'Success', ini memicu trigger otomatis pengisian dompet saldo pembeli
                const { error } = await kasirDB.from('topup_saldo').update({ status: 'Success' }).eq('id', id);
                if (error) throw error;
                
                alert("Sukses! Saldo gaib berhasil ditransfer ke akun pelanggan.");
            } catch (err) {
                alert("Gagal memproses persetujuan!");
                buttonElement.innerText = "✔ SUKSES (APPROVE)";
                buttonElement.disabled = false;
            }
        }

        // 4. TOMBOL REJECT: Membatalkan permintaan deposit
        async function tolakDepositPelanggan(id, buttonElement) {
            if (!confirm("Yakin ingin menolak rekuest deposit ini?")) return;

            buttonElement.innerText = "WAIT...";
            buttonElement.disabled = true;

            try {
                const { error } = await kasirDB.from('topup_saldo').update({ status: 'Failed' }).eq('id', id);
                if (error) throw error;
            } catch (err) {
                alert("Gagal membatalkan rekuest!");
                buttonElement.innerText = "❌ TOLAK";
                buttonElement.disabled = false;
            }
        }

        // 5. FITUR REAL-TIME: Ada pelanggan klik "+ ISI" di web, antrean langsung nongol live di layar HP Mas Eko!
        kasirDB.channel('public:update_antrean_admin')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'topup_saldo' }, payload => {
                if (!document.getElementById('konten-admin').classList.contains('hidden')) {
                    muatAntreanDepositMandiri();
                }
            }).subscribe();

    </script>
</body>
</html>
